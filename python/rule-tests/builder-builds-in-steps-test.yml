id: builder-builds-in-steps
valid:
  # stores-part, assignment: a method that assigns an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self) -> None:
            self._name = ""

        def name(self, name: str) -> "ExampleBuilder":
            self._name = name
            return self

        def build(self) -> Example:
            return Example(self._name)

  # stores-part, subscript assignment: a method that sets a key on a dict on self
  - |
    class ExampleBuilder:
        def __init__(self) -> None:
            self._headers: dict[str, str] = {}

        def header(self, key: str, value: str) -> "ExampleBuilder":
            self._headers[key] = value
            return self

        def build(self) -> Example:
            return Example(self._headers)

  # stores-part, augmented assignment: a method that adds to a counter on self
  - |
    class ExampleBuilder:
        def __init__(self) -> None:
            self._total = 0

        def add(self, amount: int) -> None:
            self._total += amount

        def build(self) -> Example:
            return Example(self._total)

  # stores-part, mutating call: a method that appends to a list on self
  - |
    class ExampleBuilder:
        def __init__(self) -> None:
            self._lines: list[str] = []

        def line(self, text: str) -> "ExampleBuilder":
            self._lines.append(text)
            return self

        def build(self) -> Example:
            return Example(self._lines)

  # part-method: a decorated method that assigns an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self) -> None:
            self._name = ""

        @traced
        def name(self, name: str) -> "ExampleBuilder":
            self._name = name
            return self

        def build(self) -> Example:
            return Example(self._name)

  # returns-new-builder, replace(self, ...): a method that returns replace(self, ...)
  - |
    @dataclass(frozen=True)
    class ExampleBuilder:
        name: str = ""

        def with_name(self, name: str) -> "ExampleBuilder":
            return replace(self, name=name)

        def build(self) -> Example:
            return Example(self.name)

  # returns-new-builder, module.replace(self, ...): a method that returns dataclasses.replace(self, ...)
  - |
    @dataclasses.dataclass(frozen=True)
    class ExampleBuilder:
        name: str = ""

        def with_name(self, name: str) -> "ExampleBuilder":
            return dataclasses.replace(self, name=name)

        def build(self) -> Example:
            return Example(self.name)

  # returns-new-builder, type(self)(...): a method that returns type(self)(...)
  - |
    class ExampleBuilder:
        def __init__(self, name: str = "") -> None:
            self._name = name

        def with_name(self, name: str) -> "ExampleBuilder":
            return type(self)(name)

        def build(self) -> Example:
            return Example(self._name)

  # returns-new-builder, ...Builder(...): a method that returns ExampleBuilder(...)
  - |
    class ExampleBuilder:
        def __init__(self, name: str = "") -> None:
            self._name = name

        def with_name(self, name: str) -> "ExampleBuilder":
            return ExampleBuilder(name)

        def build(self) -> Example:
            return Example(self._name)

  # rule, class name: a class whose name ends in Factory, with one build call
  - |
    class ExampleFactory:
        def build(self, name: str) -> Example:
            return Example(name)

invalid:
  # rule: a Builder whose only method is a build call from arguments
  - |
    class ExampleBuilder:
        def build(self, name: str, total: int) -> Example:
            return Example(name, total)

  # part-method, __init__: only __init__ assigns attributes of self
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name

        def build(self) -> Example:
            return Example(self._name)

  # part-method, build: only build() assigns an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name
            self._built: Example | None = None

        def build(self) -> Example:
            self._built = Example(self._name)
            return self._built

  # part-method, create: only create() assigns an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name
            self._created: Example | None = None

        def create(self) -> Example:
            self._created = Example(self._name)
            return self._created

  # part-method, make: only make() adds to an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name
            self._made = 0

        def make(self) -> Example:
            self._made += 1
            return Example(self._name)

  # part-method, __call__: only __call__ appends to an attribute of self
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name
            self._history: list[Example] = []

        def __call__(self) -> Example:
            product = Example(self._name)
            self._history.append(product)
            return product

  # stores-part, self: a class method that sets an attribute on cls
  - |
    class ExampleBuilder:
        name = ""

        @classmethod
        def configure(cls, name: str) -> None:
            cls.name = name

        def build(self) -> Example:
            return Example(self.name)

  # stores-part, self: another method adds to a local
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name

        def label(self, suffix: str) -> str:
            label = self._name
            label += suffix
            return label

        def build(self) -> Example:
            return Example(self._name)

  # stores-part, mutating call: a method calls a non-mutating method on self's attribute
  - |
    class ExampleBuilder:
        def __init__(self, name: str) -> None:
            self._name = name

        def initial(self) -> str:
            return self._name.upper()[:1]

        def build(self) -> Example:
            return Example(self._name)
