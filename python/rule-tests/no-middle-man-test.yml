id: no-middle-man
valid:
  # A method that sums the items of what the collaborator returns
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def total(self, example_id):
            example = self._repository.get(example_id)
            return sum(item.price for item in example.items)

  # Methods forward to different collaborators
  - |
    class ExampleFacade:
        def __init__(self, reader, writer):
            self._reader = reader
            self._writer = writer

        def get(self, example_id):
            return self._reader.get(example_id)

        def save(self, example):
            self._writer.save(example)

  # A class with one forwarding method
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

  # A forwarding property beside two forwarding methods
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

        @property
        def size(self):
            return self._repository.count()

  # A class with a base class whose methods all forward
  - |
    class ExampleStore(Store):
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

  # A forwarding call wrapped in other work
  - |
    class ExampleService:
        def __init__(self, repository):
            self._repository = repository

        def get(self, example_id):
            return ExampleView(self._repository.get(example_id))

        def save(self, example):
            self._repository.save(example)

  # A method with a statement before its forwarding call
  - |
    class ExampleService:
        def __init__(self, repository, log):
            self._repository = repository
            self._log = log

        def get(self, example_id):
            self._log.info(example_id)
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

  # A method with a docstring and a statement before its forwarding call
  - |
    class ExampleService:
        def __init__(self, repository, log):
            self._repository = repository
            self._log = log

        def get(self, example_id):
            """Get one example."""
            self._log.info(example_id)
            return self._repository.get(example_id)

        def save(self, example):
            self._repository.save(example)

  # An __init__ that calls the collaborator, beside one forwarding method
  - |
    class ExampleSession:
        def __init__(self, connection):
            self._connection = connection
            self._connection.open()

        def query(self, sql):
            return self._connection.query(sql)

