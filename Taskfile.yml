version: "3"

vars:
  CODEGUARD: '{{.CODEGUARD | default "codeguard"}}'

tasks:
  test:
    desc: Run the pattern rule and gate tests, and check each judge rule eval's triggers.
    cmds:
      - "{{.CODEGUARD}} test {{.CLI_ARGS}}"

  eval:
    desc: Judge each judge rule eval case with its binding's model. Calls Gemini.
    cmds:
      - "{{.CODEGUARD}} eval {{.CLI_ARGS}}"
