skill: general/skills/construction-in-its-home
severity: warning
paths: ["**/*.py", "**/*.ts", "**/*.tsx"]
exclude_paths:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/tests/**"
  - "**/conftest.py"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/__tests__/**"
triggers: [class-construction, defaulted-value]
