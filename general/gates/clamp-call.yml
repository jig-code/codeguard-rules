id: clamp-call
language: python
rule:
  any:
  - kind: call
    all:
    - has:
        field: function
        regex: ^(max|min)$
    - has:
        field: arguments
        has:
          nthChild: 2
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
  - kind: call
    has:
      field: function
      regex: (^|\.)clip$
  - kind: conditional_expression
    all:
    - has:
        any:
        - kind: integer
        - kind: float
    - has:
        kind: comparison_operator
        regex: '[<>]'
  - kind: if_statement
    all:
    - has:
        field: condition
        kind: comparison_operator
        regex: '[<>]'
    - has:
        field: consequence
        has:
          kind: expression_statement
          has:
            kind: assignment
            has:
              field: right
              any:
              - kind: integer
              - kind: float
