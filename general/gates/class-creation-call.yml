id: class-creation-call
language: python
rule:
  kind: call
  any:
  - all:
    - has:
        field: function
        kind: identifier
        regex: ^type$
    - has:
        field: arguments
        has:
          nthChild: 3
  - all:
    - has:
        field: function
        regex: (^|\.)new_class$
    - has:
        field: arguments
        has:
          nthChild: 2
