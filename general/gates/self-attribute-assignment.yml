id: self-attribute-assignment
language: python
rule:
  inside:
    kind: function_definition
    stopBy: end
    inside:
      kind: class_definition
      stopBy: end
  any:
  - kind: assignment
    has:
      field: left
      any:
      - kind: attribute
        regex: ^self\.
      - kind: subscript
        regex: ^self\.__dict__\[
      - kind: pattern_list
        has:
          kind: attribute
          regex: ^self\.
      - kind: tuple_pattern
        has:
          kind: attribute
          regex: ^self\.
  - kind: augmented_assignment
    has:
      field: left
      kind: attribute
      regex: ^self\.
  - kind: call
    all:
    - has:
        field: function
        regex: ^(setattr|object\.__setattr__)$
    - has:
        field: arguments
        has:
          nthChild: 1
          regex: ^self$
