id: guard-check
language: python
rule:
  any:
  - kind: assert_statement
  - kind: call
    has:
      field: function
      regex: ^(isinstance|issubclass|cast|typing\.cast)$
  - kind: if_statement
    has:
      field: consequence
      has:
        kind: raise_statement
  - kind: if_statement
    has:
      field: consequence
      all:
      - has:
          nthChild: 1
          any:
          - kind: return_statement
          - kind: continue_statement
          - kind: break_statement
      - not:
          has:
            nthChild: 2
  - kind: if_statement
    not:
      has:
        any:
        - kind: else_clause
        - kind: elif_clause
    has:
      field: consequence
      has:
        nthChild:
          position: 1
          reverse: true
        any:
        - kind: return_statement
        - kind: continue_statement
        - kind: break_statement
  - kind: if_statement
    has:
      field: consequence
      has:
        kind: expression_statement
        has:
          kind: call
          has:
            field: function
            regex: ^(sys\.exit|exit|os\._exit)$
  - kind: elif_clause
    has:
      field: consequence
      has:
        kind: raise_statement
  - kind: else_clause
    has:
      field: body
      has:
        kind: raise_statement
  - kind: case_clause
    has:
      field: consequence
      has:
        kind: raise_statement
  - kind: conditional_expression
    has:
      kind: comparison_operator
      regex: \bis (not )?None\b
