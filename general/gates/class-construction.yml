id: class-construction
language: python
rule:
  inside:
    stopBy: end
    kind: function_definition
  any:
  - kind: call
    all:
    - has:
        field: function
        any:
        - kind: identifier
          regex: ^_?[A-Z]
        - kind: attribute
          has:
            field: object
            kind: identifier
            regex: ^_?[A-Z]
    - has:
        field: arguments
        regex: ^\(\s*[^\s)]
  - kind: assignment
    all:
    - has:
        field: type
        regex: ^_?[A-Z]
    - has:
        field: right
        kind: dictionary
