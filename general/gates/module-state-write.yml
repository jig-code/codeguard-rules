id: module-state-write
language: python
rule:
  any:
  - kind: global_statement
  - all:
    - any:
      - kind: assignment
      - kind: augmented_assignment
    - inside:
        kind: function_definition
        stopBy: end
    - has:
        field: left
        any:
        - kind: subscript
          has:
            field: value
            any:
            - kind: identifier
              pattern: $N
            - kind: attribute
              has:
                field: object
                kind: identifier
                pattern: $N
        - kind: attribute
          has:
            field: object
            kind: identifier
            pattern: $N
    - inside:
        kind: module
        stopBy: end
        has:
          kind: expression_statement
          has:
            kind: assignment
            has:
              field: left
              pattern: $N
  - kind: call
    all:
    - inside:
        kind: function_definition
        stopBy: end
    - has:
        field: function
        kind: attribute
        all:
        - has:
            field: object
            any:
            - kind: identifier
              pattern: $N
            - kind: attribute
              has:
                field: object
                kind: identifier
                pattern: $N
        - has:
            field: attribute
            regex: ^(append|extend|insert|add|update|setdefault|pop|popitem|clear|remove|discard|appendleft|extendleft)$
    - inside:
        kind: module
        stopBy: end
        has:
          kind: expression_statement
          has:
            kind: assignment
            has:
              field: left
              pattern: $N
  - all:
    - any:
      - all:
        - any:
          - kind: assignment
          - kind: augmented_assignment
        - has:
            field: left
            any:
            - kind: attribute
              has: {field: object, kind: identifier, regex: ^self$}
            - kind: subscript
              has:
                field: value
                kind: attribute
                has: {field: object, kind: identifier, regex: ^self$}
      - kind: call
        has:
          field: function
          kind: attribute
          all:
          - has:
              field: object
              kind: attribute
              has: {field: object, kind: identifier, regex: ^self$}
          - has:
              field: attribute
              regex: ^(append|extend|insert|add|update|setdefault|pop|popitem|clear|remove|discard|appendleft|extendleft)$
    - inside:
        kind: function_definition
        stopBy: end
        not:
          has: {field: name, regex: ^__init__$}
    - inside:
        kind: class_definition
        stopBy: end
        has:
          field: name
          pattern: $C
    - inside:
        kind: module
        stopBy: end
        has:
          kind: expression_statement
          has:
            kind: assignment
            has:
              field: right
              kind: call
              has:
                field: function
                kind: identifier
                pattern: $C
