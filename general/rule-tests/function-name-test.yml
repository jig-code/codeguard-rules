id: function-name
valid:
# Function body
- |
  total = order.total
# Parameter name
- |
  order
# Call of a function
- |
  submit(order)
# Class name
- |
  class Order:
      pass
# Name assigned a value that is not a lambda
- |
  submit = make_submitter()
# Name bound to a value that is not a lambda
- |
  submit = order.submit
# Lambda passed as an argument
- |
  orders.sort(key=lambda order: order.total)
invalid:
# Module function name
- |
  def submit(order):
      return order
# Method name
- |
  class Order:
      def submit(self):
          pass
# Async function name
- |
  async def submit(order):
      return order
# Decorated method name
- |
  class Order:
      @classmethod
      def submit(cls):
          pass
# Nested function name
- |
  def submit(order):
      def stamp():
          return order
      return stamp()
# Name assigned a lambda
- |
  submit = lambda order: order
