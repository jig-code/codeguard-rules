id: subclass-override
valid:
# A class with no base class
- |
  class FakeQueue:
      def enqueue(self, name, message):
          self.messages.append(message)
# A class whose only argument is a metaclass, with no base class
- |
  class PluginRegistry(metaclass=RegistryMeta):
      def register(self, plugin):
          self.plugins.append(plugin)
# A subclass with only class attributes
- |
  class SlowFakeQueue(FakeQueue):
      delay = 5
# A test class's methods: the Test prefix
- |
  class TestOrders(BaseOrderTest):
      def test_total(self):
          assert total([1]) == 1
# A unittest class named with a Tests suffix
- |
  class OrderTests(TestCase):
      def test_total(self):
          assert total([1]) == 1
invalid:
# A method of a subclass
- |
  class CheckingFakeQueue(FakeQueue):
      def enqueue(self, name, message):
          assert message
# A decorated method of a subclass
- |
  class FixedRates(FakeRates):
      @property
      def currency(self):
          return "EUR"
# An async method of a subclass
- |
  class FailingClient(FakeClient):
      async def fetch(self, path):
          raise TimeoutError
# A subclass of a dotted base
- |
  class RecordingMailer(fakes.FakeMailer):
      def send(self, message):
          self.sent_count += 1
# A subclass of a parameterized base
- |
  class TextCache(Cache[str]):
      def get(self, key):
          return self.entries[key]
# A subclass with a base and a metaclass
- |
  class Exporter(Base, metaclass=ABCMeta):
      def export(self, rows):
          return rows
# A subclass's __init__
- |
  class SeededStore(FakeStore):
      def __init__(self):
          super().__init__()
          self.rows = [1]
# A subclass whose name only ends in Test is not a test class
- |
  class ABTest(Experiment):
      def variant(self, user):
          return self.variants[0]
# A subclass whose name only starts with the letters Test is not a test class
- |
  class Testimonial(Card):
      def render(self):
          return self.quote
