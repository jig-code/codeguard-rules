id: shared-instance
valid:
# Instance created inside a function
- |
  def create_validator():
      validator = ExampleValidator()
      return validator
# Module constant that is not a call
- |
  LIMIT = 3
# Default that is not a call
- |
  def check(order, strict=False):
      pass
# Decorated function: a cached_property caches per instance, so no instance is shared
- |
  class ExampleService:
      @cached_property
      def validator(self):
          return ExampleValidator()
# Decorated function: a decorator that caches nothing
- |
  @staticmethod
  def get_validator():
      return ExampleValidator()
invalid:
# Module-level instance
- |
  validator = ExampleValidator(region="eu")
# Annotated module-level instance
- |
  validator: ExampleValidator = ExampleValidator()
# Module-level result of a factory function
- |
  validator = create_validator()
# Class attribute instance
- |
  class ExampleService:
      validator = ExampleValidator()
# Default argument instance
- |
  def check(order, validator=ExampleValidator()):
      pass
# Typed default argument instance
- |
  def check(order, validator: ExampleValidator = ExampleValidator()):
      pass
# Cached factory function
- |
  @cache
  def get_validator():
      return ExampleValidator()
# Cached factory function with lru_cache
- |
  @lru_cache(maxsize=1)
  def get_validator():
      return ExampleValidator()
# Cached factory function with functools.lru_cache
- |
  @functools.lru_cache
  def get_validator():
      return ExampleValidator()
# Singleton factory function
- |
  @singleton
  def get_validator():
      return ExampleValidator()
