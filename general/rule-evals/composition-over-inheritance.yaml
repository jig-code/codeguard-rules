- name: a customer's order list view mixes in the framework's login requirement
  inputs:
    file: orders/views.py
    unchanged:
      orders/__init__.py: ""
      orders/models.py: |
        from django.conf import settings
        from django.db import models


        class Order(models.Model):
            customer = models.ForeignKey(settings.AUTH_USER_MODEL, on_delete=models.PROTECT)
            reference = models.CharField(max_length=32)
            placed_at = models.DateTimeField()
    after: |
      from django.contrib.auth.mixins import LoginRequiredMixin
      from django.db.models import QuerySet
      from django.views.generic import ListView

      from orders.models import Order


      class MyOrdersView(LoginRequiredMixin, ListView):
          template_name = "orders/mine.html"
          context_object_name = "orders"

          def get_queryset(self) -> QuerySet[Order]:
              return Order.objects.filter(customer=self.request.user).order_by("-placed_at")
  expected_output:
    outcome: valid
- name: a delivery run inherits a depot's opening hours as its own fields
  inputs:
    file: logistics/runs.py
    unchanged:
      logistics/depots.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Depot:
            code: str
            latitude: float
            longitude: float
            opening_hour: int
            closing_hour: int
    after: |
      from dataclasses import dataclass

      from logistics.depots import Depot


      @dataclass(frozen=True)
      class DeliveryRun(Depot):
          driver: str
          departure_hour: int

          def departs_while_open(self) -> bool:
              return self.opening_hour <= self.departure_hour < self.closing_hour
