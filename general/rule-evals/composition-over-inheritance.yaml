- name: an oversize shipping method adds a handling fee to the cost of the shipping method it inherits
  inputs:
    file: shipping/methods.py
    unchanged:
      shipping/base.py: |
        from decimal import Decimal


        class ShippingMethod:
            def __init__(self, name: str, base_fee: Decimal, per_kg: Decimal) -> None:
                self.name = name
                self.base_fee = base_fee
                self.per_kg = per_kg

            def cost(self, weight_kg: Decimal) -> Decimal:
                return self.base_fee + self.per_kg * weight_kg
    after: |
      from decimal import Decimal

      from shipping.base import ShippingMethod


      class OversizeShipping(ShippingMethod):
          def __init__(
              self, name: str, base_fee: Decimal, per_kg: Decimal, handling_fee: Decimal
          ) -> None:
              super().__init__(name, base_fee, per_kg)
              self.handling_fee = handling_fee

          def cost(self, weight_kg: Decimal) -> Decimal:
              return super().cost(weight_kg) + self.handling_fee
  expected_output:
    outcome: valid
- name: a markdown exporter implements the abstract report exporter
  inputs:
    file: reports/markdown.py
    unchanged:
      reports/model.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class RegionTotal:
            region: str
            total: Decimal


        @dataclass(frozen=True)
        class SalesReport:
            title: str
            rows: tuple[RegionTotal, ...]
      reports/export.py: |
        from abc import ABC, abstractmethod

        from reports.model import SalesReport


        class ReportExporter(ABC):
            @abstractmethod
            def export(self, report: SalesReport) -> bytes:
                """Render the report as the bytes of one file."""
    after: |
      from reports.export import ReportExporter
      from reports.model import SalesReport


      class MarkdownExporter(ReportExporter):
          def export(self, report: SalesReport) -> bytes:
              lines = [f"# {report.title}", ""]
              lines += [f"- {row.region}: {row.total}" for row in report.rows]
              return "\n".join(lines).encode()
  expected_output:
    outcome: valid
- name: warehouse and bin models inherit the framework's database model base
  inputs:
    file: warehouses/models.py
    after: |
      from django.db import models


      class Warehouse(models.Model):
          code = models.CharField(max_length=8, unique=True)
          city = models.CharField(max_length=64)


      class Bin(models.Model):
          warehouse = models.ForeignKey(Warehouse, on_delete=models.CASCADE)
