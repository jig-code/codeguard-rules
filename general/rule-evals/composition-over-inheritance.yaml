    outcome: invalid
- name: a method is added to a class whose base the change leaves as it was
  inputs:
    file: airport/printing.py
    unchanged:
      devices/thermal.py: |
        class ThermalPrinter:
            def __init__(self, device_path: str) -> None:
                self.device_path = device_path

            def print_lines(self, lines: list[str]) -> None:
                with open(self.device_path, "w") as device:
                    device.write("\n".join(lines) + "\n\n\n")
    before: |
      from devices.thermal import ThermalPrinter


      class BoardingPassPrinter(ThermalPrinter):
          def print_pass(self, passenger: str, flight: str, gate: str) -> None:
              self.print_lines([passenger, f"Flight {flight}", f"Gate {gate}"])
    after: |
      from devices.thermal import ThermalPrinter


      class BoardingPassPrinter(ThermalPrinter):
          def print_pass(self, passenger: str, flight: str, gate: str) -> None:
              self.print_lines([passenger, f"Flight {flight}", f"Gate {gate}"])

          def print_gate_change(self, flight: str, new_gate: str) -> None:
              self.print_lines([f"Flight {flight}", f"now boards at gate {new_gate}"])
  expected_output:
    outcome: skipped
- name: a shipment tracker extends a circuit breaker to guard its carrier calls
  inputs:
    file: shipping/tracker.ts
    unchanged:
      resilience/circuit-breaker.ts: |
        export class CircuitBreaker {
          private failures = 0;

          constructor(private readonly threshold: number) {}

          async execute<T>(work: () => Promise<T>): Promise<T> {
            if (this.failures >= this.threshold) {
              throw new Error("circuit open");
            }
            try {
              const result = await work();
              this.failures = 0;
              return result;
            } catch (error) {
              this.failures += 1;
              throw error;
            }
          }
        }
      carriers/carrier.ts: |
        export type TrackingStatus = {
          trackingNumber: string;
          state: "in_transit" | "delivered" | "returned";
        };

        export interface CarrierApi {
          trackingStatus(trackingNumber: string): Promise<TrackingStatus>;
        }
    after: |
      import { CarrierApi, TrackingStatus } from "../carriers/carrier";
      import { CircuitBreaker } from "../resilience/circuit-breaker";

      export class ShipmentTracker extends CircuitBreaker {
        constructor(private readonly carrier: CarrierApi) {
          super(5);
        }

        async status(trackingNumber: string): Promise<TrackingStatus> {
          return this.execute(() => this.carrier.trackingStatus(trackingNumber));
        }
      }
  expected_output:
    outcome: invalid
