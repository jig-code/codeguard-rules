cases:
- name: a function named validate submits and saves the order
  inputs:
    file: orders/submit.py
    after: |
      from datetime import datetime, timezone

      from orders.models import Order, OrderStatus
      from orders.repository import OrderRepository


      def validate_order(order: Order, repository: OrderRepository) -> None:
          order.status = OrderStatus.SUBMITTED
          order.submitted_at = datetime.now(timezone.utc)
          repository.save(order)
  expected_output:
    outcome: invalid
- name: a function named submit submits and saves the order
  inputs:
    file: orders/submit.py
    after: |
      from datetime import datetime, timezone

      from orders.models import Order, OrderStatus
      from orders.repository import OrderRepository


      def submit(order: Order, repository: OrderRepository) -> None:
          order.status = OrderStatus.SUBMITTED
          order.submitted_at = datetime.now(timezone.utc)
          repository.save(order)
  expected_output:
    outcome: valid
- name: a function named for open orders counts the customer's undelivered shipments
  inputs:
    file: shipping/counts.py
    after: |
      from shipping.models import Shipment


      def count_open_orders(customer_id: int) -> int:
          return Shipment.objects.filter(customer_id=customer_id, delivered_at__isnull=True).count()
  expected_output:
    outcome: invalid
- name: a class named for PDF renders HTML
  inputs:
    file: billing/rendering.py
    after: |
      from html import escape

      from billing.invoice import Invoice


      class PdfInvoiceRenderer:
          def render(self, invoice: Invoice) -> str:
              rows = "".join(
                  f"<tr><td>{escape(line.description)}</td><td>{line.amount}</td></tr>"
                  for line in invoice.lines
              )
              return f"<h1>Invoice {escape(invoice.number)}</h1><table>{rows}</table>"
  expected_output:
    outcome: invalid
- name: a Django model's save hook sets the slug before saving
  inputs:
    file: blog/models.py
    after: |
      from django.db import models
      from django.utils.text import slugify


      class Post(models.Model):
          title = models.CharField(max_length=200)
          slug = models.SlugField(unique=True)

          def save(self, *args, **kwargs):
              if not self.slug:
                  self.slug = slugify(self.title)
              super().save(*args, **kwargs)
  expected_output:
    outcome: valid
- name: a constant changes
  inputs:
    file: blog/settings.py
    before: |
      POSTS_PER_PAGE = 10
    after: |
      POSTS_PER_PAGE = 20
  expected_output:
    outcome: skipped
- name: a function named delete disables the user
  inputs:
    file: accounts/users.ts
    after: |
      import { UserRepository } from "./repository";

      export async function deleteUser(users: UserRepository, id: string): Promise<void> {
        const user = await users.get(id);
        user.disabled = true;
        user.disabledAt = new Date();
        await users.save(user);
      }
  expected_output:
    outcome: invalid
- name: a function named for discounts sums the invoices' tax
  inputs:
    file: billing/totals.ts
    after: |
      import { Invoice } from "./invoice";

      export function totalDiscounts(invoices: Invoice[]): number {
        return invoices.reduce((sum, invoice) => sum + invoice.taxCents, 0);
      }
  expected_output:
    outcome: invalid
- name: a function named sorted by date filters out cancelled events
  inputs:
    file: calendar/events.ts
    after: |
      import { CalendarEvent } from "./event";

      export function sortedByDate(events: CalendarEvent[]): CalendarEvent[] {
        return events.filter((event) => !event.cancelled);
      }
  expected_output:
    outcome: invalid
- name: a function named parse parses the amount
  inputs:
    file: billing/amount.ts
    after: |
      export function parseAmount(text: string): number {
        const amount = Number(text.trim());
        if (text.trim() === "" || !Number.isFinite(amount)) {
          throw new Error(`not an amount: ${text}`);
        }
        return amount;
      }
  expected_output:
    outcome: valid
