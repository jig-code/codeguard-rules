cases:
- name: a receipt call passes an order's email with the order
  inputs:
    file: orders/complete.py
    unchanged:
      orders/receipts.py: |
        def send_receipt(email, order):
            body = f"Order {order.id}: {order.total_cents / 100:.2f}"
            return {"to": email, "subject": "Your receipt", "body": body}
    after: |
      from orders.receipts import send_receipt


      def complete(order):
          order.status = "complete"
          return send_receipt(order.email, order)
  expected_output:
    outcome: invalid
- name: an invoice total takes a customer and a rate computed from that customer earlier in the caller
  inputs:
    file: billing/invoice.py
    after: |
      def tax_rate(customer):
          return 0 if customer.tax_exempt else customer.region_rate


      def invoice_total(subtotal, rate, customer):
          total = subtotal * (1 + rate)
          if customer.is_member:
              total *= 0.95
          return total


      def bill(customer, subtotal):
          rate = tax_rate(customer)
          return invoice_total(subtotal, rate, customer)
  expected_output:
    outcome: invalid
- name: a summary dataclass is built from lines and the total of those lines
  inputs:
    file: reports/summary.py
    after: |
      from dataclasses import dataclass


      def total_of(lines):
          return sum(line.amount for line in lines)


      @dataclass(frozen=True)
      class Summary:
          total: int
          lines: list


      def summarize(lines):
          return Summary(total=total_of(lines), lines=lines)
  expected_output:
    outcome: invalid
- name: a dict lookup takes a key and a default computed from that key
  inputs:
    file: config/timeouts.py
    after: |
      DEFAULTS = {"connect": 5, "read": 30}


      def default_for(name):
          return DEFAULTS.get(name, 10)


      def timeout(settings, name):
          return settings.get(name, default_for(name))
  expected_output:
    outcome: valid
- name: a service is built from a session and a repository made from that session
  inputs:
    file: orders/wiring.py
    after: |
      class OrderRepository:
          def __init__(self, session):
              self._session = session

          def get(self, order_id):
              return self._session.get("orders", order_id)


      class OrderService:
          def __init__(self, repo, session):
              self._repo = repo
              self._session = session

          def cancel(self, order_id):
              order = self._repo.get(order_id)
              order.status = "cancelled"
              self._session.commit()


      def build_service(session):
          return OrderService(repo=OrderRepository(session), session=session)
  expected_output:
    outcome: valid
- name: an email call passes an order's address and a subject
