- name: a notify function call passes an order's email with the order
  inputs:
    file: orders/ship.ts
    after: |
      export interface Order {
        id: string;
        email: string;
        totalCents: number;
      }

      export function notify(email: string, order: Order): { to: string; body: string } {
        return { to: email, body: `Order ${order.id} shipped` };
      }

      export function ship(order: Order) {
        return notify(order.email, order);
      }
  expected_output:
    outcome: invalid
- name: a fee function takes a customer and a rate computed from that customer earlier in the caller
  inputs:
    file: billing/fees.ts
    after: |
      export interface Customer {
        id: string;
        taxExempt: boolean;
        regionRate: number;
        isMember: boolean;
      }

      export function taxRate(customer: Customer): number {
        return customer.taxExempt ? 0 : customer.regionRate;
      }

      export function invoiceTotal(subtotal: number, rate: number, customer: Customer): number {
        const total = subtotal * (1 + rate);
        return customer.isMember ? total * 0.95 : total;
      }

      export function bill(customer: Customer, subtotal: number): number {
        const rate = taxRate(customer);
        return invoiceTotal(subtotal, rate, customer);
      }
  expected_output:
    outcome: invalid
- name: a summary class is built from lines and the total of those lines
  inputs:
    file: reports/summary.ts
    after: |
      export interface Line {
        label: string;
        amount: number;
      }

      export class Summary {
        constructor(
          readonly total: number,
          readonly lines: readonly Line[],
        ) {}
      }

      export function totalOf(lines: readonly Line[]): number {
        return lines.reduce((sum, line) => sum + line.amount, 0);
      }

      export function summarize(lines: readonly Line[]): Summary {
        return new Summary(totalOf(lines), lines);
      }
  expected_output:
    outcome: invalid
- name: a map lookup falls back to a default computed from its key
  inputs:
    file: config/limits.ts
    after: |
      const DEFAULTS: Record<string, number> = { upload: 10, download: 50 };

      export function defaultFor(name: string): number {
        return DEFAULTS[name] ?? 5;
      }

      export function limit(limits: Map<string, number>, name: string): number {
        return limits.get(name) ?? defaultFor(name);
      }
  expected_output:
    outcome: valid
