- name: a picking batch decides inline whether an order is paid in full and off hold, so a new hold reason misses picking
  inputs:
    file: warehouse/picking.ts
    unchanged:
      orders/order.ts: |
        export interface Order {
          id: string;
          totalCents: number;
          paidCents: number;
          onHold: boolean;
        }
    after: |
      import type { Order } from "../orders/order";

      export function nextBatch(orders: readonly Order[], limit: number): Order[] {
        const batch: Order[] = [];
        for (const order of orders) {
          const readyToShip = order.paidCents >= order.totalCents && !order.onHold;
          if (readyToShip) {
            batch.push(order);
          }
        }
        return batch.slice(0, limit);
      }
  expected_output:
    outcome: invalid
- name: a trial email copies a trial's fields but works out on the way whether the trial has lapsed, so a change to conversions misses the email
  inputs:
    file: notifications/trial-email.ts
    unchanged:
      trials/trial.ts: |
        export interface Trial {
          workspaceName: string;
          ownerEmail: string;
          endsAt: Date;
          convertedAt: Date | null;
        }
    after: |
      import type { Trial } from "../trials/trial";

      export interface TrialEmail {
        to: string;
        workspace: string;
        lapsed: boolean;
      }

      export function trialEmail(trial: Trial, now: Date): TrialEmail {
        return {
          to: trial.ownerEmail,
          workspace: trial.workspaceName,
          lapsed: trial.convertedAt === null && trial.endsAt.getTime() <= now.getTime(),
        };
      }
  expected_output:
    outcome: invalid
