- name: the vehicle module gains a service-due check beside the vehicle interface, the module a change to vehicle fields meets
  inputs:
    file: fleet/vehicle.ts
    before: |
      export interface Vehicle {
        plate: string;
        odometerKm: number;
        lastServiceKm: number;
        serviceIntervalKm: number;
      }
    after: |
      export interface Vehicle {
        plate: string;
        odometerKm: number;
        lastServiceKm: number;
        serviceIntervalKm: number;
      }

      export function serviceDue(vehicle: Vehicle): boolean {
        return vehicle.odometerKm - vehicle.lastServiceKm >= vehicle.serviceIntervalKm;
      }
  expected_output:
    outcome: valid
- name: a rental check weighs a party against a kayak's seats and load limit, an answer neither type can give from its own fields
  inputs:
    file: rentals/fit.ts
    unchanged:
      rentals/kayak.ts: |
        export interface Kayak {
          id: string;
          seats: number;
          maxLoadKg: number;
        }
      rentals/party.ts: |
        export interface Party {
          leadName: string;
          people: number;
          totalWeightKg: number;
        }
    after: |
      import type { Kayak } from "./kayak";
      import type { Party } from "./party";

      export function fits(party: Party, kayak: Kayak): boolean {
        return party.people <= kayak.seats && party.totalWeightKg <= kayak.maxLoadKg;
      }
  expected_output:
    outcome: valid
- name: a manifest orders shipments by one field, when each was dispatched, and works out nothing about a shipment
  inputs:
    file: logistics/manifest.ts
    unchanged:
      logistics/shipment.ts: |
        export interface Shipment {
          trackingCode: string;
          destination: string;
          dispatchedAt: Date;
        }
    after: |
      import type { Shipment } from "./shipment";

      export function earliestFirst(shipments: readonly Shipment[]): Shipment[] {
        return [...shipments].sort((a, b) => a.dispatchedAt.getTime() - b.dispatchedAt.getTime());
      }
  expected_output:
    outcome: valid
