- name: the warranty module gains a coverage check beside the warranty type, the module a change to warranty fields meets
  inputs:
    file: warranties/models.py
    before: |
      from dataclasses import dataclass
      from datetime import date


      @dataclass(frozen=True)
      class Warranty:
          serial_number: str
          purchased_on: date
          coverage_days: int
          voided: bool
    after: |
      from dataclasses import dataclass
      from datetime import date, timedelta


      @dataclass(frozen=True)
      class Warranty:
          serial_number: str
          purchased_on: date
          coverage_days: int
          voided: bool


      def covers(warranty: Warranty, repair_day: date) -> bool:
          last_day = warranty.purchased_on + timedelta(days=warranty.coverage_days)
          return not warranty.voided and repair_day <= last_day
  expected_output:
    outcome: valid
- name: a dispatcher matches a courier's shift against a delivery window, an answer neither type can give from its own fields
  inputs:
    file: dispatch/matching.py
    unchanged:
      couriers/__init__.py: ""
      couriers/models.py: |
        from dataclasses import dataclass
        from datetime import time


        @dataclass(frozen=True)
        class Courier:
            name: str
            shift_start: time
            shift_end: time
      deliveries/__init__.py: ""
      deliveries/models.py: |
        from dataclasses import dataclass
        from datetime import time


        @dataclass(frozen=True)
        class DeliveryWindow:
            order_id: int
            opens: time
            closes: time
    after: |
      from couriers.models import Courier
      from deliveries.models import DeliveryWindow


      def can_deliver(courier: Courier, window: DeliveryWindow) -> bool:
          return courier.shift_start <= window.opens and window.closes <= courier.shift_end
  expected_output:
    outcome: valid
- name: a review queue orders applications by one field, when each was submitted, and works out nothing about an application
  inputs:
    file: admissions/queue.py
    unchanged:
      admissions/__init__.py: ""
      admissions/applications.py: |
