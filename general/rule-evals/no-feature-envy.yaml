- name: a log pruner reads two fields of the standard library's stat result, a type the program doesn't define
  inputs:
    file: maintenance/pruning.py
    after: |
      import os


      def is_prunable(entry: os.stat_result, older_than: float) -> bool:
          return entry.st_size == 0 and entry.st_mtime < older_than
  expected_output:
    outcome: valid
- name: an SLA check works out a ticket's deadline from its fields outside the ticket module, so a change to SLA hours misses it
  inputs:
    file: support/sla.ts
    unchanged:
      support/ticket.ts: |
        export interface Ticket {
          id: string;
          openedAt: Date;
          slaHours: number;
          status: "open" | "pending" | "closed";
        }
    after: |
      import type { Ticket } from "./ticket";

      export function isBreached(ticket: Ticket, now: Date): boolean {
        const deadline = ticket.openedAt.getTime() + ticket.slaHours * 3_600_000;
        return ticket.status !== "closed" && deadline < now.getTime();
      }
  expected_output:
    outcome: invalid
- name: a dashboard counts breached tickets with the check the ticket module exports
  inputs:
    file: support/dashboard.ts
    unchanged:
      support/ticket.ts: |
        export interface Ticket {
          id: string;
          openedAt: Date;
          slaHours: number;
          status: "open" | "pending" | "closed";
        }

        const HOUR_MS = 60 * 60 * 1000;

        export function isBreached(ticket: Ticket, now: Date): boolean {
          const deadline = ticket.openedAt.getTime() + ticket.slaHours * HOUR_MS;
          return ticket.status !== "closed" && deadline < now.getTime();
        }
    after: |
      import { isBreached, type Ticket } from "./ticket";

      export function breachedCount(tickets: Ticket[], now: Date): number {
        return tickets.filter((ticket) => isBreached(ticket, now)).length;
      }
  expected_output:
    outcome: valid
- name: a payout service works out a sale's net from the sale's own amounts, so a change to refunds misses payouts
  inputs:
    file: payouts/service.ts
    unchanged:
      sales/sale.ts: |
        export type Country = "DE" | "FR" | "NL";

        export interface Sale {
          id: string;
          sellerId: string;
          grossCents: number;
          refundedCents: number;
          country: Country;
        }
    after: |
      import type { Sale } from "../sales/sale";

      export class PayoutService {
        constructor(private readonly bankAccountId: string) {}

        netCents(sale: Sale): number {
          return sale.grossCents - sale.refundedCents;
        }
      }
  expected_output:
    outcome: invalid
- name: a VAT function applies the tax module's own rates to a sale, knowledge the sale doesn't have
  inputs:
    file: tax/vat.ts
    unchanged:
      sales/sale.ts: |
        export type Country = "DE" | "FR" | "NL";

        export interface Sale {
          id: string;
          sellerId: string;
          grossCents: number;
          refundedCents: number;
          country: Country;
        }
    after: |
      import type { Country, Sale } from "../sales/sale";

      const VAT_RATES: Record<Country, number> = { DE: 0.19, FR: 0.2, NL: 0.21 };

      export function vatCents(sale: Sale): number {
        return Math.round(sale.grossCents * VAT_RATES[sale.country]);
      }
  expected_output:
    outcome: valid
- name: a report row copies a sale's fields into columns and decides nothing
  inputs:
    file: reports/sales-rows.ts
    unchanged:
      sales/sale.ts: |
        export type Country = "DE" | "FR" | "NL";

        export interface Sale {
          id: string;
          sellerId: string;
          grossCents: number;
          refundedCents: number;
          country: Country;
        }
    after: |
