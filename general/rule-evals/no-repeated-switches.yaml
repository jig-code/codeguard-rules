cases:
- name: a new channel is added to the one isinstance chain over the notification channels
  inputs:
    file: notify/channels.py
    before: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class EmailChannel:
          address: str


      @dataclass(frozen=True)
      class SmsChannel:
          phone: str


      @dataclass(frozen=True)
      class PushChannel:
          device_token: str


      Channel = EmailChannel | SmsChannel | PushChannel


      def cost_per_message_cents(channel: Channel) -> int:
          if isinstance(channel, SmsChannel):
              return 4
          elif isinstance(channel, PushChannel):
              return 1
          else:
              return 0
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class EmailChannel:
          address: str


      @dataclass(frozen=True)
      class SmsChannel:
          phone: str


      @dataclass(frozen=True)
      class PushChannel:
          device_token: str


      @dataclass(frozen=True)
      class WhatsAppChannel:
          phone: str


      Channel = EmailChannel | SmsChannel | PushChannel | WhatsAppChannel


      def cost_per_message_cents(channel: Channel) -> int:
          if isinstance(channel, SmsChannel):
              return 4
          elif isinstance(channel, PushChannel):
              return 1
          elif isinstance(channel, WhatsAppChannel):
              return 2
          else:
              return 0
  expected_output:
    outcome: valid
- name: a second match on the coverage tier ends in a default branch
  inputs:
    file: insurance/policy.py
    before: |
      from dataclasses import dataclass
      from enum import Enum


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case _:
                  return 250
    after: |
      from dataclasses import dataclass
      from enum import Enum


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case _:
                  return 250


      def claim_limit_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 10_000
              case Coverage.STANDARD:
                  return 50_000
              case _:
                  return 250_000
  expected_output:
    outcome: invalid
- name: two matches on the coverage tier each end in assert_never
  inputs:
    file: insurance/policy.py
    before: |
      from dataclasses import dataclass
      from enum import Enum
      from typing import assert_never


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case Coverage.PREMIUM:
                  return 250
              case _:
                  assert_never(policy.coverage)
    after: |
      from dataclasses import dataclass
      from enum import Enum
      from typing import assert_never


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case Coverage.PREMIUM:
                  return 250
              case _:
                  assert_never(policy.coverage)


      def claim_limit_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 10_000
              case Coverage.STANDARD:
                  return 50_000
              case Coverage.PREMIUM:
                  return 250_000
              case _:
                  assert_never(policy.coverage)
  expected_output:
    outcome: valid
- name: a statement line switches on the entry classes that an imported module's match already switches on
  inputs:
    file: ledger/statement.py
    unchanged:
      ledger/entries.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Charge:
            amount_cents: int


        @dataclass(frozen=True)
        class Refund:
            amount_cents: int


        @dataclass(frozen=True)
        class Payout:
            amount_cents: int


        Entry = Charge | Refund | Payout


        def ledger_account(entry: Entry) -> str:
            match entry:
                case Charge():
                    return "4000-revenue"
                case Refund():
                    return "4100-returns"
                case _:
                    return "1000-cash"
    after: |
      from ledger.entries import Charge, Entry, Refund


      def statement_line(entry: Entry) -> str:
          if isinstance(entry, Charge):
              label = "Charge"
          elif isinstance(entry, Refund):
              label = "Refund"
          else:
              label = "Payout"
          return f"{label:<10}{entry.amount_cents / 100:>10.2f}"
  expected_output:
    outcome: invalid
- name: a webhook parser builds the billing event that the payload's type string names
  inputs:
    file: billing/webhooks.py
    unchanged:
      billing/events.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class SeatAdded:
            seats: int


        @dataclass(frozen=True)
        class SeatRemoved:
            seats: int


        BillingEvent = SeatAdded | SeatRemoved


        def seat_delta(event: BillingEvent) -> int:
            match event:
                case SeatAdded(seats=seats):
                    return seats
                case SeatRemoved(seats=seats):
                    return -seats
    after: |
      from billing.events import BillingEvent, SeatAdded, SeatRemoved


      def parse_event(payload: dict[str, str]) -> BillingEvent:
          match payload["type"]:
              case "seat.added":
                  return SeatAdded(seats=int(payload["seats"]))
              case "seat.removed":
                  return SeatRemoved(seats=int(payload["seats"]))
              case other:
                  raise ValueError(f"unknown billing event type {other!r}")
  expected_output:
    outcome: valid
