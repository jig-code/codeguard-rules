- name: a row parser builds the discount that the row's kind column names
  inputs:
    file: src/pricing/discountRow.ts
    unchanged:
      src/pricing/discount.ts: |
        export type Discount =
          | { kind: "percent"; percent: number }
          | { kind: "fixed"; amountCents: number };

        export function discountedCents(discount: Discount, priceCents: number): number {
          switch (discount.kind) {
            case "percent":
              return Math.round(priceCents * (1 - discount.percent / 100));
            case "fixed":
              return priceCents - discount.amountCents;
          }
        }
    after: |
      import type { Discount } from "./discount";

      export interface DiscountRow {
        kind: string;
        value: number;
      }

      export function discountFromRow(row: DiscountRow): Discount {
        switch (row.kind) {
          case "percent":
            return { kind: "percent", percent: row.value };
          case "fixed":
            return { kind: "fixed", amountCents: row.value };
          default:
            throw new Error(`unknown discount kind ${row.kind}`);
        }
      }
  expected_output:
    outcome: valid
- name: a receipt line reads the fare from the one switch on the ticket kind
  inputs:
    file: src/transit/ticket.ts
    before: |
      export type Ticket =
        | { kind: "adult"; zones: number }
        | { kind: "child"; zones: number }
        | { kind: "senior"; zones: number };

      export function fareCents(ticket: Ticket): number {
        switch (ticket.kind) {
          case "child":
            return 120 * ticket.zones;
          case "senior":
            return 100 * ticket.zones;
          default:
            return 250 * ticket.zones;
        }
      }
    after: |
      export type Ticket =
        | { kind: "adult"; zones: number }
        | { kind: "child"; zones: number }
        | { kind: "senior"; zones: number };

      export function fareCents(ticket: Ticket): number {
        switch (ticket.kind) {
          case "child":
            return 120 * ticket.zones;
          case "senior":
            return 100 * ticket.zones;
          default:
            return 250 * ticket.zones;
        }
      }

      export function receiptLine(ticket: Ticket): string {
        return `${ticket.zones}-zone ${ticket.kind} ticket  ${(fareCents(ticket) / 100).toFixed(2)}`;
      }
  expected_output:
    outcome: valid
