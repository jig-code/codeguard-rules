- name: the new previewable switch on the document format ends in a default while the MIME type switch ends in a never check, so a new format is caught in one and quietly not previewed in the other
  inputs:
    file: src/documents/format.ts
    before: |
      export type Document =
        | { format: "pdf"; pages: number }
        | { format: "docx"; words: number }
        | { format: "html"; url: string };

      function assertNever(value: never): never {
        throw new Error(`unhandled document ${JSON.stringify(value)}`);
      }

      export function mimeType(document: Document): string {
        switch (document.format) {
          case "pdf":
            return "application/pdf";
          case "docx":
            return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
          case "html":
            return "text/html";
          default:
            return assertNever(document);
        }
      }
    after: |
      export type Document =
        | { format: "pdf"; pages: number }
        | { format: "docx"; words: number }
        | { format: "html"; url: string };

      function assertNever(value: never): never {
        throw new Error(`unhandled document ${JSON.stringify(value)}`);
      }

      export function mimeType(document: Document): string {
        switch (document.format) {
          case "pdf":
            return "application/pdf";
          case "docx":
            return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
          case "html":
            return "text/html";
          default:
            return assertNever(document);
        }
      }

      export function previewable(document: Document): boolean {
        switch (document.format) {
          case "pdf":
            return document.pages <= 200;
          case "html":
            return true;
          default:
            return false;
        }
      }
  expected_output:
    outcome: invalid
