cases:
- name: a second isinstance chain over the notification channels means a new channel must be found in both, and gets email's limits where it's missed
  inputs:
    file: notify/channels.py
    before: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class EmailChannel:
          address: str


      @dataclass(frozen=True)
      class SmsChannel:
          phone: str


      @dataclass(frozen=True)
      class PushChannel:
          device_token: str


      Channel = EmailChannel | SmsChannel | PushChannel


      def cost_per_message_cents(channel: Channel) -> int:
          if isinstance(channel, SmsChannel):
              return 4
          elif isinstance(channel, PushChannel):
              return 1
          else:
              return 0
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class EmailChannel:
          address: str


      @dataclass(frozen=True)
      class SmsChannel:
          phone: str


      @dataclass(frozen=True)
      class PushChannel:
          device_token: str


      Channel = EmailChannel | SmsChannel | PushChannel


      def cost_per_message_cents(channel: Channel) -> int:
          if isinstance(channel, SmsChannel):
              return 4
          elif isinstance(channel, PushChannel):
              return 1
          else:
              return 0


      def max_body_length(channel: Channel) -> int:
          if isinstance(channel, SmsChannel):
              return 160
          elif isinstance(channel, PushChannel):
              return 240
          else:
              return 100_000
  expected_output:
    outcome: invalid
