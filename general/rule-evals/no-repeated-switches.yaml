    unchanged:
      src/pricing/discount.ts: |
        export type Discount =
          | { kind: "percent"; percent: number }
          | { kind: "fixed"; amountCents: number };

        export function discountedCents(discount: Discount, priceCents: number): number {
          switch (discount.kind) {
            case "percent":
              return Math.round(priceCents * (1 - discount.percent / 100));
            case "fixed":
              return priceCents - discount.amountCents;
          }
        }
    after: |
      import type { Discount } from "./discount";

      export interface DiscountRow {
        kind: string;
        value: number;
      }

      export function discountFromRow(row: DiscountRow): Discount {
        switch (row.kind) {
          case "percent":
            return { kind: "percent", percent: row.value };
          case "fixed":
            return { kind: "fixed", amountCents: row.value };
          default:
            throw new Error(`unknown discount kind ${row.kind}`);
        }
      }
  expected_output:
    outcome: valid
