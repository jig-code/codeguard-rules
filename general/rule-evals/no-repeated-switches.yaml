- name: a second match on the coverage tier falls back to premium's limit, so a new tier missed there pays out the top limit
  inputs:
    file: insurance/policy.py
    before: |
      from dataclasses import dataclass
      from enum import Enum


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case _:
                  return 250
    after: |
      from dataclasses import dataclass
      from enum import Enum


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case _:
                  return 250


      def claim_limit_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 10_000
              case Coverage.STANDARD:
                  return 50_000
              case _:
                  return 250_000
  expected_output:
    outcome: invalid
- name: both coverage matches end in assert_never, so the type checker names each one when a tier is added
  inputs:
    file: insurance/policy.py
    before: |
      from dataclasses import dataclass
      from enum import Enum
      from typing import assert_never


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case Coverage.PREMIUM:
                  return 250
              case _:
                  assert_never(policy.coverage)
    after: |
      from dataclasses import dataclass
      from enum import Enum
      from typing import assert_never


      class Coverage(Enum):
          BASIC = "basic"
          STANDARD = "standard"
          PREMIUM = "premium"


      @dataclass(frozen=True)
      class Policy:
          holder: str
          coverage: Coverage


      def deductible_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 1000
              case Coverage.STANDARD:
                  return 500
              case Coverage.PREMIUM:
                  return 250
              case _:
                  assert_never(policy.coverage)


      def claim_limit_dollars(policy: Policy) -> int:
          match policy.coverage:
              case Coverage.BASIC:
                  return 10_000
              case Coverage.STANDARD:
                  return 50_000
              case Coverage.PREMIUM:
                  return 250_000
              case _:
                  assert_never(policy.coverage)
  expected_output:
    outcome: valid
- name: the statement switches on the ledger entry classes the entries module already switches on, so a new entry type prints as a payout
  inputs:
    file: ledger/statement.py
    unchanged:
      ledger/entries.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Charge:
            amount_cents: int


        @dataclass(frozen=True)
        class Refund:
            amount_cents: int


        @dataclass(frozen=True)
        class Payout:
            amount_cents: int


        Entry = Charge | Refund | Payout


        def ledger_account(entry: Entry) -> str:
            match entry:
                case Charge():
                    return "4000-revenue"
                case Refund():
                    return "4100-returns"
                case _:
                    return "1000-cash"
    after: |
      from ledger.entries import Charge, Entry, Refund


      def statement_line(entry: Entry) -> str:
          if isinstance(entry, Charge):
              label = "Charge"
          elif isinstance(entry, Refund):
              label = "Refund"
          else:
              label = "Payout"
          return f"{label:<10}{entry.amount_cents / 100:>10.2f}"
  expected_output:
    outcome: invalid
- name: the module chooses a shipment's tracking page by its carrier class in one place
  inputs:
    file: shipping/tracking.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class UpsShipment:
          tracking_number: str


      @dataclass(frozen=True)
      class DhlShipment:
          waybill: str


      @dataclass(frozen=True)
      class RoyalMailShipment:
          reference: str


      Shipment = UpsShipment | DhlShipment | RoyalMailShipment


      def tracking_url(shipment: Shipment) -> str:
          if isinstance(shipment, UpsShipment):
              return f"https://www.ups.com/track?tracknum={shipment.tracking_number}"
          elif isinstance(shipment, DhlShipment):
              return f"https://www.dhl.com/track?AWB={shipment.waybill}"
          else:
              return f"https://www.royalmail.com/track-your-item#/tracking-results/{shipment.reference}"
  expected_output:
    outcome: valid
- name: a webhook parser turns the payload's type string into the matching billing event, which decides what kind to create, not what one does
  inputs:
    file: billing/webhooks.py
    unchanged:
      billing/events.py: |
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class SeatAdded:
            seats: int


        @dataclass(frozen=True)
        class SeatRemoved:
            seats: int


        BillingEvent = SeatAdded | SeatRemoved


        def seat_delta(event: BillingEvent) -> int:
            match event:
                case SeatAdded(seats=seats):
                    return seats
                case SeatRemoved(seats=seats):
                    return -seats
    after: |
      from billing.events import BillingEvent, SeatAdded, SeatRemoved


      def parse_event(payload: dict[str, str]) -> BillingEvent:
          match payload["type"]:
              case "seat.added":
                  return SeatAdded(seats=int(payload["seats"]))
              case "seat.removed":
                  return SeatRemoved(seats=int(payload["seats"]))
              case other:
                  raise ValueError(f"unknown billing event type {other!r}")
  expected_output:
    outcome: valid
