        | { kind: "bank"; amountCents: number; iban: string }
        | { kind: "wallet"; amountCents: number; walletId: string };

      export function settlementDays(payment: Payment): number {
        switch (payment.kind) {
          case "card":
            return 2;
          case "bank":
            return 3;
          default:
            return 1;
        }
      }

      export function interchangeFeesCents(payments: readonly Payment[]): number {
        let total = 0;
        for (const payment of payments) {
          if (payment.kind === "card") {
            total += payment.interchangeFeeCents;
          }
        }
        return total;
      }
