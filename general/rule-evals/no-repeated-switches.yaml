- name: an interchange fee total picks out card payments with one tag check
  inputs:
    file: src/payments/batch.ts
    before: |
      export type Payment =
        | { kind: "card"; amountCents: number; interchangeFeeCents: number }
        | { kind: "bank"; amountCents: number; iban: string }
        | { kind: "wallet"; amountCents: number; walletId: string };

      export function settlementDays(payment: Payment): number {
        switch (payment.kind) {
          case "card":
            return 2;
          case "bank":
            return 3;
          default:
            return 1;
        }
      }
    after: |
      export type Payment =
        | { kind: "card"; amountCents: number; interchangeFeeCents: number }
        | { kind: "bank"; amountCents: number; iban: string }
        | { kind: "wallet"; amountCents: number; walletId: string };

      export function settlementDays(payment: Payment): number {
        switch (payment.kind) {
          case "card":
            return 2;
          case "bank":
            return 3;
          default:
            return 1;
        }
      }

      export function interchangeFeesCents(payments: readonly Payment[]): number {
        let total = 0;
        for (const payment of payments) {
          if (payment.kind === "card") {
            total += payment.interchangeFeeCents;
          }
        }
        return total;
      }
  expected_output:
    outcome: valid
- name: two if chains choose by an outside API's HTTP status code
  inputs:
    file: src/carrier/status.ts
    before: |
      export function shouldRetry(status: number): boolean {
        if (status === 429) {
          return true;
        } else if (status >= 500) {
          return true;
        } else {
          return false;
        }
      }
    after: |
      export function shouldRetry(status: number): boolean {
        if (status === 429) {
          return true;
        } else if (status >= 500) {
          return true;
        } else {
          return false;
        }
      }

      export function logLevel(status: number): "info" | "warn" | "error" {
        if (status >= 500) {
          return "error";
        } else if (status >= 400) {
          return "warn";
        } else {
          return "info";
        }
      }
  expected_output:
    outcome: valid
