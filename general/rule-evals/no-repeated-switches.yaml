- name: a second switch on the reward kind defaults to points, so a new reward kind is labelled as points per dollar
  inputs:
    file: src/rewards/reward.ts
    before: |
      type Reward =
        | { kind: "cashback"; percent: number }
        | { kind: "miles"; perDollar: number }
        | { kind: "points"; perDollar: number };

      export function rewardValueCents(reward: Reward, spendCents: number): number {
        switch (reward.kind) {
          case "cashback":
            return Math.round((spendCents * reward.percent) / 100);
          case "miles":
            return Math.round((spendCents / 100) * reward.perDollar * 1.2);
          default:
            return Math.round((spendCents / 100) * reward.perDollar);
        }
      }
    after: |
      type Reward =
        | { kind: "cashback"; percent: number }
        | { kind: "miles"; perDollar: number }
        | { kind: "points"; perDollar: number };

      export function rewardValueCents(reward: Reward, spendCents: number): number {
        switch (reward.kind) {
          case "cashback":
            return Math.round((spendCents * reward.percent) / 100);
          case "miles":
            return Math.round((spendCents / 100) * reward.perDollar * 1.2);
          default:
            return Math.round((spendCents / 100) * reward.perDollar);
        }
      }

      export function rewardLabel(reward: Reward): string {
        switch (reward.kind) {
          case "cashback":
            return `${reward.percent}% cash back`;
          case "miles":
            return `${reward.perDollar} miles per dollar`;
          default:
            return `${reward.perDollar} points per dollar`;
        }
      }
  expected_output:
    outcome: invalid
- name: both switches on the reward kind end in a never check, so the compiler flags each one when a kind is added
  inputs:
    file: src/rewards/reward.ts
    before: |
      type Reward =
        | { kind: "cashback"; percent: number }
        | { kind: "miles"; perDollar: number }
        | { kind: "points"; perDollar: number };

      function assertNever(value: never): never {
        throw new Error(`unhandled reward ${JSON.stringify(value)}`);
      }

      export function rewardValueCents(reward: Reward, spendCents: number): number {
        switch (reward.kind) {
          case "cashback":
            return Math.round((spendCents * reward.percent) / 100);
          case "miles":
            return Math.round((spendCents / 100) * reward.perDollar * 1.2);
          case "points":
            return Math.round((spendCents / 100) * reward.perDollar);
          default:
            return assertNever(reward);
        }
      }
    after: |
      type Reward =
        | { kind: "cashback"; percent: number }
        | { kind: "miles"; perDollar: number }
        | { kind: "points"; perDollar: number };

      function assertNever(value: never): never {
        throw new Error(`unhandled reward ${JSON.stringify(value)}`);
      }

      export function rewardValueCents(reward: Reward, spendCents: number): number {
        switch (reward.kind) {
          case "cashback":
            return Math.round((spendCents * reward.percent) / 100);
          case "miles":
            return Math.round((spendCents / 100) * reward.perDollar * 1.2);
          case "points":
            return Math.round((spendCents / 100) * reward.perDollar);
          default:
            return assertNever(reward);
        }
      }

      export function rewardLabel(reward: Reward): string {
        switch (reward.kind) {
          case "cashback":
            return `${reward.percent}% cash back`;
          case "miles":
            return `${reward.perDollar} miles per dollar`;
          case "points":
            return `${reward.perDollar} points per dollar`;
          default:
            return assertNever(reward);
        }
      }
  expected_output:
    outcome: valid
- name: a second instanceof chain over the vehicle classes means a new vehicle needs no truck licence wherever the chain is missed
  inputs:
    file: src/fleet/vehicle.ts
    before: |
      export class Van {
        constructor(readonly payloadKg: number) {}
      }

      export class Truck {
        constructor(readonly axles: number) {}
      }

      export class CargoBike {}

      export type Vehicle = Van | Truck | CargoBike;

      export function hourlyRateCents(vehicle: Vehicle): number {
        if (vehicle instanceof Truck) {
          return 9000 + vehicle.axles * 1000;
        } else if (vehicle instanceof Van) {
          return 6000;
        }
        return 2500;
      }
    after: |
      export class Van {
        constructor(readonly payloadKg: number) {}
      }

      export class Truck {
        constructor(readonly axles: number) {}
      }

      export class CargoBike {}

      export type Vehicle = Van | Truck | CargoBike;

      export function hourlyRateCents(vehicle: Vehicle): number {
        if (vehicle instanceof Truck) {
          return 9000 + vehicle.axles * 1000;
        } else if (vehicle instanceof Van) {
          return 6000;
        }
        return 2500;
      }

      export function needsTruckLicence(vehicle: Vehicle): boolean {
        if (vehicle instanceof Truck) {
          return true;
        } else if (vehicle instanceof Van) {
          return vehicle.payloadKg > 3500;
        }
        return false;
      }
  expected_output:
    outcome: invalid
- name: each vehicle class answers whether it needs a truck licence, and the interface makes a new class answer too
  inputs:
    file: src/fleet/vehicle.ts
    before: |
      export interface Vehicle {
        hourlyRateCents(): number;
      }

      export class Van implements Vehicle {
        constructor(readonly payloadKg: number) {}

        hourlyRateCents(): number {
          return 6000;
        }
      }

      export class Truck implements Vehicle {
        constructor(readonly axles: number) {}

        hourlyRateCents(): number {
          return 9000 + this.axles * 1000;
        }
      }

      export class CargoBike implements Vehicle {
        hourlyRateCents(): number {
          return 2500;
        }
      }
    after: |
      export interface Vehicle {
        hourlyRateCents(): number;
        needsTruckLicence(): boolean;
      }

      export class Van implements Vehicle {
        constructor(readonly payloadKg: number) {}

        hourlyRateCents(): number {
          return 6000;
        }

        needsTruckLicence(): boolean {
          return this.payloadKg > 3500;
        }
      }

      export class Truck implements Vehicle {
        constructor(readonly axles: number) {}

        hourlyRateCents(): number {
          return 9000 + this.axles * 1000;
        }

        needsTruckLicence(): boolean {
          return true;
        }
      }

      export class CargoBike implements Vehicle {
        hourlyRateCents(): number {
          return 2500;
        }

        needsTruckLicence(): boolean {
          return false;
        }
      }
  expected_output:
    outcome: valid
- name: a second if chain on the plan gives an unlisted plan enterprise support, so a new plan gets a one-hour response by default
  inputs:
    file: src/billing/plan.ts
    before: |
      export enum Plan {
        Free,
        Team,
        Enterprise,
      }

      export function seatLimit(plan: Plan): number {
        if (plan === Plan.Free) {
          return 3;
        } else if (plan === Plan.Team) {
          return 50;
        } else {
          return 10_000;
        }
      }
    after: |
      export enum Plan {
        Free,
        Team,
        Enterprise,
      }

      export function seatLimit(plan: Plan): number {
        if (plan === Plan.Free) {
          return 3;
        } else if (plan === Plan.Team) {
          return 50;
        } else {
          return 10_000;
        }
      }

      export function supportResponseHours(plan: Plan): number {
        if (plan === Plan.Free) {
          return 72;
        } else if (plan === Plan.Team) {
