- name: summing withdrawals over a customer's accounts picks out the savings accounts with one isinstance check, which narrows to one kind rather than choosing among them
  inputs:
    file: banking/accounts.py
    before: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class CheckingAccount:
          balance_cents: int


      @dataclass(frozen=True)
      class SavingsAccount:
          balance_cents: int
          withdrawals_this_month: int


      @dataclass(frozen=True)
      class BrokerageAccount:
          cash_cents: int


      Account = CheckingAccount | SavingsAccount | BrokerageAccount


      def monthly_fee_cents(account: Account) -> int:
          if isinstance(account, CheckingAccount):
              return 500
          elif isinstance(account, SavingsAccount):
              return 0
          else:
              return 1500
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class CheckingAccount:
          balance_cents: int


      @dataclass(frozen=True)
      class SavingsAccount:
          balance_cents: int
          withdrawals_this_month: int


      @dataclass(frozen=True)
      class BrokerageAccount:
          cash_cents: int


      Account = CheckingAccount | SavingsAccount | BrokerageAccount


      def monthly_fee_cents(account: Account) -> int:
          if isinstance(account, CheckingAccount):
              return 500
          elif isinstance(account, SavingsAccount):
              return 0
          else:
              return 1500


      def savings_withdrawals_this_month(accounts: list[Account]) -> int:
          return sum(
              account.withdrawals_this_month
              for account in accounts
              if isinstance(account, SavingsAccount)
          )
