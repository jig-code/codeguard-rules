- name: a parking route works out the fee rules in its own body, so a new tariff means editing the HTTP endpoint
  inputs:
    file: parking/api.py
    after: |
      from datetime import datetime

      from fastapi import APIRouter

      router = APIRouter()


      @router.get("/quote")
      def quote(entered_at: datetime, left_at: datetime) -> dict[str, int]:
          minutes = int((left_at - entered_at).total_seconds() // 60)
          if minutes <= 30:
              cents = 0
          else:
              hours = -(-(minutes - 30) // 60)
              cents = min(hours * 350, 2400)
          return {"fee_cents": cents}
