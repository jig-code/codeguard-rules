cases:
- name: the timing system's XML and the age-group award rules share one function, so a new timing vendor means editing the awards
  inputs:
    file: races/podium.py
    after: |
      import xml.etree.ElementTree as ET
      from collections import defaultdict


      CHRONOTRACK = "{urn:chronotrack:results:2}"


      def age_group_podiums(chronotrack_xml: str) -> dict[str, list[str]]:
          finishers = []
          for element in ET.fromstring(chronotrack_xml).iter(f"{CHRONOTRACK}Finisher"):
              hours, minutes, seconds = (int(part) for part in element.attrib["ChipTime"].split(":"))
              finishers.append((element.attrib["BibNo"], int(element.attrib["AgeOnRaceDay"]), hours * 3600 + minutes * 60 + seconds))

          groups: dict[str, list[tuple[int, str]]] = defaultdict(list)
          for bib, age, chip_seconds in finishers:
              if age < 30:
                  group = "open"
              elif age < 50:
                  group = "masters"
              else:
                  group = "grand masters"
              groups[group].append((chip_seconds, bib))
          return {group: [bib for _, bib in sorted(times)[:3]] for group, times in groups.items()}
  expected_output:
    outcome: invalid
- name: podiums are found by reading the timing file and then applying the award rules, each in its own module
  inputs:
    file: races/podium.py
    unchanged:
      races/timing_xml.py: |
        import xml.etree.ElementTree as ET
        from dataclasses import dataclass


        @dataclass(frozen=True)
        class Finisher:
            bib: str
            age: int
            seconds: int


        CHRONOTRACK = "{urn:chronotrack:results:2}"


        def read_finishers(chronotrack_xml: str) -> list[Finisher]:
            finishers = []
            for element in ET.fromstring(chronotrack_xml).iter(f"{CHRONOTRACK}Finisher"):
                hours, minutes, seconds = (int(part) for part in element.attrib["ChipTime"].split(":"))
                seconds_total = hours * 3600 + minutes * 60 + seconds
                finishers.append(Finisher(element.attrib["BibNo"], int(element.attrib["AgeOnRaceDay"]), seconds_total))
            return finishers
      races/awards.py: |
        from collections import defaultdict

        from races.timing_xml import Finisher


        def age_group(age: int) -> str:
            if age < 30:
                return "open"
            if age < 50:
                return "masters"
            return "grand masters"


        def podiums(finishers: list[Finisher]) -> dict[str, list[str]]:
            groups: dict[str, list[Finisher]] = defaultdict(list)
            for finisher in finishers:
                groups[age_group(finisher.age)].append(finisher)
            return {group: [f.bib for f in sorted(members, key=lambda f: f.seconds)[:3]] for group, members in groups.items()}
    after: |
      from races.awards import podiums
      from races.timing_xml import read_finishers


      def age_group_podiums(chronotrack_xml: str) -> dict[str, list[str]]:
          return podiums(read_finishers(chronotrack_xml))
  expected_output:
    outcome: valid
- name: locker assignments gain the label printer's command language, so a new printer model means editing the locker class
  inputs:
