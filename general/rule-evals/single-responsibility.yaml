- name: a GPX reader parses, converts and builds track points, all of the one file format
  inputs:
    file: routes/gpx.py
    after: |
      import xml.etree.ElementTree as ET
      from dataclasses import dataclass
      from datetime import datetime

      GPX = "{http://www.topografix.com/GPX/1/1}"


      @dataclass(frozen=True)
      class TrackPoint:
          latitude: float
          longitude: float
          elevation_m: float | None
          recorded_at: datetime | None


      def read_track(gpx_text: str) -> list[TrackPoint]:
          points = []
          for element in ET.fromstring(gpx_text).iter(f"{GPX}trkpt"):
              elevation = element.find(f"{GPX}ele")
              time = element.find(f"{GPX}time")
              points.append(
                  TrackPoint(
                      latitude=float(element.attrib["lat"]),
                      longitude=float(element.attrib["lon"]),
                      elevation_m=float(elevation.text) if elevation is not None else None,
                      recorded_at=datetime.fromisoformat(time.text) if time is not None else None,
                  )
              )
          return points
  expected_output:
    outcome: valid
- name: a refund quote rejects an unpaid ticket, logs and counts the quote as part of working out the refund rules
  inputs:
    file: box_office/refunds.py
    after: |
      import logging
      from dataclasses import dataclass
      from decimal import Decimal

      from prometheus_client import Counter

      log = logging.getLogger(__name__)
      REFUND_QUOTES = Counter("refund_quotes_total", "Refund amounts quoted at the box office")


      @dataclass(frozen=True)
      class Purchase:
          ticket_id: str
          paid: Decimal
          days_before_show: int


      def refund_amount(purchase: Purchase) -> Decimal:
          if purchase.paid <= 0:
              raise ValueError(f"ticket {purchase.ticket_id} was not paid for")
          if purchase.days_before_show >= 14:
              amount = purchase.paid
          elif purchase.days_before_show >= 3:
              amount = (purchase.paid / 2).quantize(Decimal("0.01"))
          else:
              amount = Decimal("0.00")
          log.info("refund quote for ticket %s: %s", purchase.ticket_id, amount)
          REFUND_QUOTES.inc()
          return amount
  expected_output:
    outcome: valid
- name: a library suspends an overdue member between loading and saving them, which holds only the suspension rules
  inputs:
    file: library/suspensions.py
    unchanged:
      library/members.py: |
        from dataclasses import dataclass
        from datetime import date
        from typing import Protocol


        @dataclass(frozen=True)
        class Loan:
            item_id: str
            due: date


        @dataclass
        class Member:
            member_id: str
            loans: list[Loan]
            suspended: bool


        class MemberRepository(Protocol):
            def get(self, member_id: str) -> Member: ...

            def save(self, member: Member) -> None: ...
    after: |
      from datetime import date

      from library.members import MemberRepository


      def suspend_if_overdue(members: MemberRepository, member_id: str, today: date) -> None:
          member = members.get(member_id)
          overdue = [loan for loan in member.loans if loan.due < today]
          if len(overdue) >= 3 or any((today - loan.due).days > 30 for loan in overdue):
              member.suspended = True
              members.save(member)
  expected_output:
    outcome: valid
- name: a hotel booking model answers its nights, long-stay status and overlaps from its own columns
  inputs:
    file: hotel/models.py
    after: |
      from datetime import date

      from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


      class Base(DeclarativeBase):
          pass


      LONG_STAY_NIGHTS = 7


      class Booking(Base):
          __tablename__ = "bookings"

          id: Mapped[int] = mapped_column(primary_key=True)
          room_number: Mapped[str]
          check_in: Mapped[date]
          check_out: Mapped[date]

          @property
          def nights(self) -> int:
              return (self.check_out - self.check_in).days

          @property
          def is_long_stay(self) -> bool:
              return self.nights >= LONG_STAY_NIGHTS

          def overlaps(self, other: "Booking") -> bool:
              return (
                  self.room_number == other.room_number
                  and self.check_in < other.check_out
                  and other.check_in < self.check_out
              )
  expected_output:
    outcome: valid
- name: a restaurant wait list gains texting through Twilio's API, which none of its other methods use, so a new SMS vendor means editing the wait list
  inputs:
    file: restaurant/wait_list.py
    before: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Party:
          party_id: str
          name: str
          phone: str
          size: int


      class WaitList:
          def __init__(self) -> None:
              self._waiting: list[Party] = []

          def add(self, party: Party) -> None:
              self._waiting.append(party)

          def seat_next(self, free_seats: int) -> Party | None:
              for party in self._waiting:
                  if party.size <= free_seats:
                      self._waiting.remove(party)
                      return party
              return None
    after: |
      from dataclasses import dataclass

      import httpx


      @dataclass(frozen=True)
      class Party:
          party_id: str
          name: str
          phone: str
          size: int


      class WaitList:
          def __init__(self, twilio: httpx.Client, account_sid: str, from_number: str) -> None:
              self._waiting: list[Party] = []
              self._twilio = twilio
              self._account_sid = account_sid
              self._from_number = from_number

          def add(self, party: Party) -> None:
              self._waiting.append(party)

          def seat_next(self, free_seats: int) -> Party | None:
              for party in self._waiting:
                  if party.size <= free_seats:
                      self._waiting.remove(party)
                      return party
              return None

          def text_table_ready(self, party: Party) -> None:
              response = self._twilio.post(
                  f"https://api.twilio.com/2010-04-01/Accounts/{self._account_sid}/Messages.json",
                  data={"From": self._from_number, "To": party.phone, "Body": f"{party.name}, your table is ready."},
              )
              response.raise_for_status()
  expected_output:
    outcome: invalid
