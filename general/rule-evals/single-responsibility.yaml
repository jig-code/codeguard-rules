- name: the survey tool's export layout and the NPS scoring rules share one function, so a new survey tool means editing the scoring
  inputs:
    file: src/feedback/nps.ts
    after: |
      import { z } from "zod";

      const typeformExport = z.object({
        form_response: z.array(
          z.object({
            definition: z.object({ fields: z.array(z.object({ id: z.string(), ref: z.string(), type: z.string() })) }),
            answers: z.array(z.object({ field: z.object({ id: z.string() }), type: z.string(), number: z.number().optional() })),
          }),
        ),
      });

      const PROMOTER_MIN_SCORE = 9;
      const DETRACTOR_MAX_SCORE = 6;

      export function netPromoterScore(exportJson: string): number {
        const payload = typeformExport.parse(JSON.parse(exportJson));
        const scores: number[] = [];
        for (const response of payload.form_response) {
          const question = response.definition.fields.find((f) => f.ref === "recommend" && f.type === "opinion_scale");
          const answer = response.answers.find((a) => a.field.id === question?.id && a.type === "number");
          if (answer?.number !== undefined) scores.push(answer.number);
        }
        const promoters = scores.filter((score) => score >= PROMOTER_MIN_SCORE).length;
        const detractors = scores.filter((score) => score <= DETRACTOR_MAX_SCORE).length;
        return Math.round(((promoters - detractors) / scores.length) * 100);
      }
  expected_output:
    outcome: invalid
