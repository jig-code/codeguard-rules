- name: a subtitle reader parses cue timings and text, all of the one file format
  inputs:
    file: src/media/vtt.ts
    after: |
      export interface Cue {
        startMs: number;
        endMs: number;
        text: string;
      }

      function toMs(stamp: string): number {
        const [h, m, s] = stamp.split(":");
        return (Number(h) * 3600 + Number(m) * 60 + Number(s)) * 1000;
      }

      export function readCues(vtt: string): Cue[] {
        return vtt
          .split(/\n\n+/)
          .filter((block) => block.includes("-->"))
          .map((block) => {
            const [timing, ...lines] = block.split("\n");
            const [start, end] = timing.split(" --> ");
            return { startMs: toMs(start), endMs: toMs(end.split(" ")[0]), text: lines.join("\n") };
          });
      }
  expected_output:
    outcome: valid
- name: a group ticket handler works out the discount tiers in its own body, so a new price list means editing the HTTP endpoint
  inputs:
    file: src/tickets/handlers.ts
    after: |
      import type { Request, Response } from "express";
      import { z } from "zod";

      const quoteQuery = z.object({ tickets: z.coerce.number().int().positive() });

      const FULL_PRICE_CENTS = 4500;
      const GROUP_OF_10_CENTS = 4000;
      const GROUP_OF_20_CENTS = 3600;

      export function groupTicketQuote(req: Request, res: Response): void {
        const { tickets } = quoteQuery.parse(req.query);
        let unitCents = FULL_PRICE_CENTS;
        if (tickets >= 20) {
          unitCents = GROUP_OF_20_CENTS;
        } else if (tickets >= 10) {
          unitCents = GROUP_OF_10_CENTS;
        }
        res.status(200).json({ totalCents: tickets * unitCents });
      }
  expected_output:
    outcome: invalid
- name: a late fee rejects a return before the loan, logs and counts the fee as part of working out the fee rules
  inputs:
    file: src/library/lateFees.ts
    after: |
      import pino from "pino";
      import { Counter } from "prom-client";

      const log = pino();
      const lateFeesCharged = new Counter({ name: "late_fees_charged_total", help: "Late fees worked out at return" });

      export interface Loan {
        itemId: string;
        borrowedOn: Date;
        dueOn: Date;
        returnedOn: Date;
        isReference: boolean;
      }

      const DAILY_FEE_CENTS = 25;
      const REFERENCE_DAILY_FEE_CENTS = 100;
      const MAX_FEE_CENTS = 1000;
      const MS_PER_DAY = 86_400_000;

      export function lateFeeCents(loan: Loan): number {
        if (loan.returnedOn < loan.borrowedOn) {
          throw new Error(`item ${loan.itemId} was returned before it was borrowed`);
        }
        const daysLate = Math.ceil((loan.returnedOn.getTime() - loan.dueOn.getTime()) / MS_PER_DAY);
        const daily = loan.isReference ? REFERENCE_DAILY_FEE_CENTS : DAILY_FEE_CENTS;
        const fee = daysLate > 0 ? Math.min(daysLate * daily, MAX_FEE_CENTS) : 0;
        log.info({ itemId: loan.itemId, fee }, "late fee worked out");
        lateFeesCharged.inc();
        return fee;
      }
  expected_output:
    outcome: valid
- name: a subscription pauses after failed charges between loading and saving it, which holds only the pause rules
  inputs:
    file: src/billing/pauseSubscription.ts
    unchanged:
      src/billing/subscriptions.ts: |
        export interface Subscription {
          id: string;
          status: "active" | "paused";
          failedCharges: number;
          lastChargeAttempt: Date;
        }

        export interface SubscriptionRepository {
          find(id: string): Promise<Subscription>;
          save(subscription: Subscription): Promise<void>;
        }
    after: |
      import type { SubscriptionRepository } from "./subscriptions";

      const MAX_FAILED_CHARGES = 3;

      export async function pauseAfterFailedCharges(subscriptions: SubscriptionRepository, id: string): Promise<void> {
        const subscription = await subscriptions.find(id);
        if (subscription.status === "active" && subscription.failedCharges >= MAX_FAILED_CHARGES) {
          await subscriptions.save({ ...subscription, status: "paused" });
        }
      }
  expected_output:
    outcome: valid
- name: a gym membership entity answers whether it is active and how long it runs from its own columns
  inputs:
    file: src/gym/membership.entity.ts
    after: |
      import { Column, Entity, PrimaryGeneratedColumn } from "typeorm";

      @Entity()
      export class Membership {
        @PrimaryGeneratedColumn()
        id!: number;

        @Column()
        memberId!: string;

        @Column()
        startsOn!: Date;

        @Column()
        endsOn!: Date;

        @Column()
        frozen!: boolean;

        isActiveOn(day: Date): boolean {
          return !this.frozen && this.startsOn <= day && day < this.endsOn;
        }

        get lengthInDays(): number {
          return Math.round((this.endsOn.getTime() - this.startsOn.getTime()) / 86_400_000);
        }
      }
  expected_output:
    outcome: valid
- name: a gradebook gains posting grades to Canvas's API, which none of its other methods use, so an LMS change means editing the gradebook
  inputs:
    file: src/school/gradebook.ts
    before: |
      export class Gradebook {
        private readonly scores = new Map<string, number>();

        record(studentId: string, score: number): void {
          this.scores.set(studentId, score);
        }

        classAverage(): number {
          const all = [...this.scores.values()];
          return all.reduce((sum, score) => sum + score, 0) / all.length;
        }
      }
    after: |
      export class Gradebook {
        private readonly scores = new Map<string, number>();

        constructor(
          private readonly canvasBaseUrl: string,
          private readonly canvasToken: string,
        ) {}

        record(studentId: string, score: number): void {
          this.scores.set(studentId, score);
        }

        classAverage(): number {
          const all = [...this.scores.values()];
          return all.reduce((sum, score) => sum + score, 0) / all.length;
        }

        async postToCanvas(courseId: string, assignmentId: string): Promise<void> {
          const gradeData = Object.fromEntries(
            [...this.scores].map(([studentId, score]) => [studentId, { posted_grade: String(score) }]),
          );
          const response = await fetch(
            `${this.canvasBaseUrl}/api/v1/courses/${courseId}/assignments/${assignmentId}/submissions/update_grades`,
            {
              method: "POST",
              headers: { Authorization: `Bearer ${this.canvasToken}`, "Content-Type": "application/json" },
              body: JSON.stringify({ grade_data: gradeData }),
            },
          );
          if (!response.ok) {
            throw new Error(`Canvas rejected the grades: ${response.status}`);
          }
        }
      }
  expected_output:
    outcome: invalid
