- name: a locker class gains a move built from its own assign and release
  inputs:
    file: gym/lockers.py
    before: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None
    after: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None

          def move(self, number: int) -> int:
              member_id = self._holders[number]
              if member_id is None:
                  raise ValueError(f"locker {number} is free")
              new_number = self.assign(member_id)
              self.release(number)
              return new_number
  expected_output:
    outcome: valid
- name: a distance adds, compares and displays itself from its own metres
  inputs:
    file: routes/distance.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True, order=True)
      class Distance:
          metres: int

          def __add__(self, other: "Distance") -> "Distance":
              return Distance(self.metres + other.metres)

          def __str__(self) -> str:
              if self.metres < 1000:
                  return f"{self.metres} m"
              return f"{self.metres / 1000:.1f} km"
  expected_output:
    outcome: valid
- name: a GPX reader parses, converts and builds track points
  inputs:
    file: routes/gpx.py
    after: |
      import xml.etree.ElementTree as ET
      from dataclasses import dataclass
      from datetime import datetime

      GPX = "{http://www.topografix.com/GPX/1/1}"


      @dataclass(frozen=True)
      class TrackPoint:
          latitude: float
          longitude: float
          elevation_m: float | None
          recorded_at: datetime | None


      def read_track(gpx_text: str) -> list[TrackPoint]:
          points = []
          for element in ET.fromstring(gpx_text).iter(f"{GPX}trkpt"):
              elevation = element.find(f"{GPX}ele")
              time = element.find(f"{GPX}time")
              points.append(
                  TrackPoint(
                      latitude=float(element.attrib["lat"]),
                      longitude=float(element.attrib["lon"]),
                      elevation_m=float(elevation.text) if elevation is not None else None,
                      recorded_at=datetime.fromisoformat(time.text) if time is not None else None,
                  )
              )
          return points
  expected_output:
    outcome: valid
- name: a refund calculation rejects an unpaid ticket, logs and counts the quote
  inputs:
    file: box_office/refunds.py
    after: |
      import logging
      from dataclasses import dataclass
      from decimal import Decimal

      from prometheus_client import Counter

      log = logging.getLogger(__name__)
      REFUND_QUOTES = Counter("refund_quotes_total", "Refund amounts quoted at the box office")


      @dataclass(frozen=True)
      class Purchase:
          ticket_id: str
          paid: Decimal
          days_before_show: int


      def refund_amount(purchase: Purchase) -> Decimal:
          if purchase.paid <= 0:
              raise ValueError(f"ticket {purchase.ticket_id} was not paid for")
          if purchase.days_before_show >= 14:
              amount = purchase.paid
          elif purchase.days_before_show >= 3:
              amount = (purchase.paid / 2).quantize(Decimal("0.01"))
          else:
              amount = Decimal("0.00")
          log.info("refund quote for ticket %s: %s", purchase.ticket_id, amount)
          REFUND_QUOTES.inc()
          return amount
  expected_output:
    outcome: valid
- name: a suspension module decides in one function and loads and saves the member in another
  inputs:
    file: library/suspensions.py
    unchanged:
      library/members.py: |
        from dataclasses import dataclass
        from datetime import date
        from typing import Protocol


        @dataclass(frozen=True)
        class Loan:
            item_id: str
            due: date


        @dataclass
        class Member:
            member_id: str
            loans: list[Loan]
            suspended: bool


        class MemberRepository(Protocol):
            def get(self, member_id: str) -> Member: ...

            def save(self, member: Member) -> None: ...
    after: |
      from datetime import date

      from library.members import Member, MemberRepository


      def should_suspend(member: Member, today: date) -> bool:
          overdue = [loan for loan in member.loans if loan.due < today]
          return len(overdue) >= 3 or any((today - loan.due).days > 30 for loan in overdue)


      def suspend_if_overdue(members: MemberRepository, member_id: str, today: date) -> None:
          member = members.get(member_id)
          if should_suspend(member, today):
              member.suspended = True
              members.save(member)
  expected_output:
    outcome: valid
- name: a wait list gains a method that texts parties through an SMS service's API
  inputs:
    file: restaurant/wait_list.py
    before: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Party:
          party_id: str
          name: str
          phone: str
          size: int


      class WaitList:
          def __init__(self) -> None:
              self._waiting: list[Party] = []

          def add(self, party: Party) -> None:
              self._waiting.append(party)

          def seat_next(self, free_seats: int) -> Party | None:
              for party in self._waiting:
                  if party.size <= free_seats:
                      self._waiting.remove(party)
                      return party
              return None
    after: |
      from dataclasses import dataclass

      import httpx


      @dataclass(frozen=True)
      class Party:
          party_id: str
          name: str
          phone: str
          size: int


      class WaitList:
          def __init__(self, twilio: httpx.Client, account_sid: str, from_number: str) -> None:
              self._waiting: list[Party] = []
              self._twilio = twilio
              self._account_sid = account_sid
              self._from_number = from_number

          def add(self, party: Party) -> None:
              self._waiting.append(party)

          def seat_next(self, free_seats: int) -> Party | None:
              for party in self._waiting:
                  if party.size <= free_seats:
                      self._waiting.remove(party)
                      return party
              return None

          def text_table_ready(self, party: Party) -> None:
              response = self._twilio.post(
                  f"https://api.twilio.com/2010-04-01/Accounts/{self._account_sid}/Messages.json",
                  data={"From": self._from_number, "To": party.phone, "Body": f"{party.name}, your table is ready."},
              )
              response.raise_for_status()
  expected_output:
    outcome: invalid
