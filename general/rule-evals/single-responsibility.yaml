- name: a shift schedule gains a method that builds a chat service's message blocks
  inputs:
    file: src/staffing/shiftSchedule.ts
    before: |
      const MAX_STAFF_PER_SHIFT = 4;

      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          const staff = this.staffed.get(shiftId) ?? [];
          if (staff.length >= MAX_STAFF_PER_SHIFT) {
            throw new Error(`shift ${shiftId} already has ${MAX_STAFF_PER_SHIFT} staff`);
          }
          this.staffed.set(shiftId, [...staff, employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }
      }
    after: |
      const MAX_STAFF_PER_SHIFT = 4;

      export class ShiftSchedule {
        private readonly staffed = new Map<string, string[]>();

        assign(shiftId: string, employeeId: string): void {
          const staff = this.staffed.get(shiftId) ?? [];
          if (staff.length >= MAX_STAFF_PER_SHIFT) {
            throw new Error(`shift ${shiftId} already has ${MAX_STAFF_PER_SHIFT} staff`);
          }
          this.staffed.set(shiftId, [...staff, employeeId]);
        }

        unassign(shiftId: string, employeeId: string): void {
          this.staffed.set(shiftId, (this.staffed.get(shiftId) ?? []).filter((id) => id !== employeeId));
        }

        slackBlocks(shiftId: string): object[] {
