- name: locker assignments gain a move to the next free locker, built from their own assign and release
  inputs:
    file: gym/lockers.py
    before: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None
    after: |
      class LockerAssignments:
          def __init__(self, locker_numbers: list[int]) -> None:
              self._holders: dict[int, str | None] = {number: None for number in locker_numbers}

          def assign(self, member_id: str) -> int:
              number = min(n for n, holder in self._holders.items() if holder is None)
              self._holders[number] = member_id
              return number

          def release(self, number: int) -> None:
              self._holders[number] = None

          def move(self, number: int) -> int:
              member_id = self._holders[number]
              if member_id is None:
                  raise ValueError(f"locker {number} is free")
              new_number = self.assign(member_id)
              self.release(number)
              return new_number
  expected_output:
    outcome: valid
- name: a distance adds, compares and displays itself from its own metres
  inputs:
    file: routes/distance.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True, order=True)
      class Distance:
          metres: int

          def __add__(self, other: "Distance") -> "Distance":
              return Distance(self.metres + other.metres)

          def __str__(self) -> str:
              if self.metres < 1000:
                  return f"{self.metres} m"
