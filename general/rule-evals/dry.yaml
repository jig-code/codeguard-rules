- name: an invoice total repeats the tax steps another function owns, so a tax change misses invoices
  inputs:
    file: src/billing/totals.ts
    before: |
      const TAX_RATE = 0.2;

      export function quoteTotal(netCents: number, discountCents: number): number {
        const taxable = Math.max(netCents - discountCents, 0);
        return Math.round(taxable * (1 + TAX_RATE));
      }
    after: |
      const TAX_RATE = 0.2;

      export function quoteTotal(netCents: number, discountCents: number): number {
        const taxable = Math.max(netCents - discountCents, 0);
        return Math.round(taxable * (1 + TAX_RATE));
      }

      export function invoiceTotal(discount: number, net: number): number {
        const taxableAmount = Math.max(net - discount, 0);
        return Math.round(taxableAmount * (1 + TAX_RATE));
      }
  expected_output:
    outcome: invalid
- name: an invoice total adds a late charge to the quote total
  inputs:
    file: src/billing/totals.ts
    before: |
      const TAX_RATE = 0.2;

      export function quoteTotal(netCents: number, discountCents: number): number {
        const taxable = Math.max(netCents - discountCents, 0);
        return Math.round(taxable * (1 + TAX_RATE));
      }
    after: |
      const TAX_RATE = 0.2;
      const LATE_CHARGE_CENTS = 1500;

      export function quoteTotal(netCents: number, discountCents: number): number {
        const taxable = Math.max(netCents - discountCents, 0);
        return Math.round(taxable * (1 + TAX_RATE));
      }

      export function invoiceTotal(netCents: number, discountCents: number, isLate: boolean): number {
        return quoteTotal(netCents, discountCents) + (isLate ? LATE_CHARGE_CENTS : 0);
      }
  expected_output:
    outcome: valid
