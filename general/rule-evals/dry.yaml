- name: a discount repeats the coupon module's steps for recognising a coupon code, so a change to which codes count must be made in both
  inputs:
    file: checkout/discounts.py
    unchanged:
      checkout/__init__.py: ""
      checkout/coupons.py: |
        import re


        def is_coupon_code(text: str) -> bool:
            code = text.strip().upper()
            if code.startswith("TEST-"):
                return False
            return re.fullmatch(r"[A-Z]{4}-\d{4}", code) is not None
    before: |
      from checkout.coupons import is_coupon_code
    after: |
      import re

      from checkout.coupons import is_coupon_code


      def discount_cents(code: str, subtotal_cents: int) -> int:
          normalized = code.strip().upper()
          if normalized.startswith("TEST-") or re.fullmatch(r"[A-Z]{4}-\d{4}", normalized) is None:
              return 0
          return subtotal_cents // 10
  expected_output:
    outcome: invalid
