- name: a checkout summary works out shipping inside its own body, so a rate change misses the summary
  inputs:
    file: src/checkout/summary.ts
    unchanged:
      src/checkout/shipping.ts: |
        export const ZONE_RATES = { domestic: 450, international: 1800 } as const;
        export const FREE_SHIPPING_FROM_CENTS = 5000;

        export function shippingCents(subtotalCents: number, zone: keyof typeof ZONE_RATES): number {
          if (zone === "domestic" && subtotalCents >= FREE_SHIPPING_FROM_CENTS) {
            return 0;
          }
          return ZONE_RATES[zone];
        }
    before: |
      import { FREE_SHIPPING_FROM_CENTS, ZONE_RATES } from "./shipping";
    after: |
      import { FREE_SHIPPING_FROM_CENTS, ZONE_RATES } from "./shipping";

      export function summaryLines(subtotalCents: number, zone: keyof typeof ZONE_RATES): string[] {
        let shipping: number = ZONE_RATES[zone];
        if (zone === "domestic" && subtotalCents >= FREE_SHIPPING_FROM_CENTS) {
          shipping = 0;
        }
        const total = subtotalCents + shipping;
        return [`Subtotal: ${subtotalCents}`, `Shipping: ${shipping}`, `Total: ${total}`];
      }
  expected_output:
    outcome: invalid
