cases:
- name: contractor pay repeats the overtime rule from gross pay, so an overtime change misses contractors
  inputs:
    file: payroll/pay.py
    before: |
      OVERTIME_AFTER_HOURS = 40
      OVERTIME_MULTIPLIER = 1.5


      def gross_pay(hours: float, hourly_rate: int) -> int:
          regular = min(hours, OVERTIME_AFTER_HOURS)
          overtime = max(hours - OVERTIME_AFTER_HOURS, 0)
          return round(regular * hourly_rate + overtime * hourly_rate * OVERTIME_MULTIPLIER)
    after: |
      OVERTIME_AFTER_HOURS = 40
      OVERTIME_MULTIPLIER = 1.5


      def gross_pay(hours: float, hourly_rate: int) -> int:
          regular = min(hours, OVERTIME_AFTER_HOURS)
          overtime = max(hours - OVERTIME_AFTER_HOURS, 0)
          return round(regular * hourly_rate + overtime * hourly_rate * OVERTIME_MULTIPLIER)


      def contractor_pay(rate_per_hour: int, logged_hours: float) -> int:
          base_hours = min(logged_hours, OVERTIME_AFTER_HOURS)
          extra_hours = max(logged_hours - OVERTIME_AFTER_HOURS, 0)
          return round(base_hours * rate_per_hour + extra_hours * rate_per_hour * OVERTIME_MULTIPLIER)
  expected_output:
    outcome: invalid
- name: contractor pay adds a platform fee to gross pay, so the overtime rule stays in one place
  inputs:
    file: payroll/pay.py
    before: |
      OVERTIME_AFTER_HOURS = 40
      OVERTIME_MULTIPLIER = 1.5


      def gross_pay(hours: float, hourly_rate: int) -> int:
          regular = min(hours, OVERTIME_AFTER_HOURS)
          overtime = max(hours - OVERTIME_AFTER_HOURS, 0)
          return round(regular * hourly_rate + overtime * hourly_rate * OVERTIME_MULTIPLIER)
    after: |
      OVERTIME_AFTER_HOURS = 40
      OVERTIME_MULTIPLIER = 1.5
      PLATFORM_FEE = 250


      def gross_pay(hours: float, hourly_rate: int) -> int:
          regular = min(hours, OVERTIME_AFTER_HOURS)
          overtime = max(hours - OVERTIME_AFTER_HOURS, 0)
          return round(regular * hourly_rate + overtime * hourly_rate * OVERTIME_MULTIPLIER)


      def contractor_pay(hours: float, hourly_rate: int) -> int:
          return gross_pay(hours, hourly_rate) - PLATFORM_FEE
  expected_output:
    outcome: valid
- name: refund recomputes the seat price the pricing module owns, so a pricing change refunds the old price
  inputs:
    file: tickets/refunds.py
    unchanged:
      tickets/__init__.py: ""
      tickets/pricing.py: |
        BOOKING_FEE = 300
        PEAK_DEMAND = 0.8


        def seat_price(base_cents: int, demand: float) -> int:
            surge = 1.25 if demand >= PEAK_DEMAND else 1.0
            return round(base_cents * surge) + BOOKING_FEE
    before: |
      from tickets.pricing import BOOKING_FEE, PEAK_DEMAND
    after: |
      from tickets.pricing import BOOKING_FEE, PEAK_DEMAND


      def refund_cents(base_cents: int, demand: float, days_before_event: int) -> int:
          surge = 1.25 if demand >= PEAK_DEMAND else 1.0
          paid = round(base_cents * surge) + BOOKING_FEE
          return paid if days_before_event >= 7 else paid // 2
  expected_output:
    outcome: invalid
- name: two private restock helpers repeat one formula with a different lead time each
  inputs:
    file: warehouse/restock.py
    after: |
      import math
      from statistics import mean

      SAFETY_FACTOR = 1.2


      def _north_restock_level(daily_sales: list[int]) -> int:
          lead_days = 4
          return math.ceil(mean(daily_sales) * lead_days * SAFETY_FACTOR)


      def _south_restock_level(daily_sales: list[int]) -> int:
          lead_days = 9
          return math.ceil(mean(daily_sales) * lead_days * SAFETY_FACTOR)


      def restock_levels(north_sales: list[int], south_sales: list[int]) -> dict[str, int]:
          return {
              "north": _north_restock_level(north_sales),
              "south": _south_restock_level(south_sales),
          }
  expected_output:
    outcome: invalid
- name: one restock formula takes each site's lead time as an argument
  inputs:
    file: warehouse/restock.py
    after: |
      import math
      from statistics import mean

      SAFETY_FACTOR = 1.2
      LEAD_DAYS = {"north": 4, "south": 9}


      def _restock_level(daily_sales: list[int], lead_days: int) -> int:
          return math.ceil(mean(daily_sales) * lead_days * SAFETY_FACTOR)


      def restock_levels(north_sales: list[int], south_sales: list[int]) -> dict[str, int]:
          return {
              "north": _restock_level(north_sales, LEAD_DAYS["north"]),
              "south": _restock_level(south_sales, LEAD_DAYS["south"]),
          }
  expected_output:
    outcome: valid
- name: backfill decodes, calibrates and saves readings itself, so a new pipeline stage skips backfilled data
  inputs:
    file: sensors/backfill.py
    unchanged:
      sensors/__init__.py: ""
      sensors/pipeline.py: |
        from sensors.calibration import Calibrator
        from sensors.decoding import Decoder
        from sensors.storage import ReadingStore


        class ReadingPipeline:
            def __init__(self, decoder: Decoder, calibrator: Calibrator, store: ReadingStore) -> None:
                self.decoder = decoder
                self.calibrator = calibrator
                self.store = store

            def run(self, frame: bytes) -> None:
                reading = self.decoder.decode(frame)
                calibrated = self.calibrator.calibrate(reading)
                self.store.save(calibrated)
    before: |
      from sensors.pipeline import ReadingPipeline


      class Backfill:
          def __init__(self, pipeline: ReadingPipeline) -> None:
              self.pipeline = pipeline
    after: |
      from sensors.pipeline import ReadingPipeline


      class Backfill:
          def __init__(self, pipeline: ReadingPipeline) -> None:
              self.pipeline = pipeline

          def replay(self, frames: list[bytes]) -> None:
              for frame in frames:
                  reading = self.pipeline.decoder.decode(frame)
                  calibrated = self.pipeline.calibrator.calibrate(reading)
                  self.pipeline.store.save(calibrated)
  expected_output:
    outcome: invalid
- name: backfill hands each frame to the reading pipeline
  inputs:
    file: sensors/backfill.py
    unchanged:
      sensors/__init__.py: ""
      sensors/pipeline.py: |
        from sensors.calibration import Calibrator
        from sensors.decoding import Decoder
        from sensors.storage import ReadingStore


        class ReadingPipeline:
            def __init__(self, decoder: Decoder, calibrator: Calibrator, store: ReadingStore) -> None:
                self.decoder = decoder
                self.calibrator = calibrator
                self.store = store

            def run(self, frame: bytes) -> None:
                reading = self.decoder.decode(frame)
                calibrated = self.calibrator.calibrate(reading)
                self.store.save(calibrated)
    before: |
      from sensors.pipeline import ReadingPipeline


      class Backfill:
          def __init__(self, pipeline: ReadingPipeline) -> None:
              self.pipeline = pipeline
    after: |
      from sensors.pipeline import ReadingPipeline


      class Backfill:
          def __init__(self, pipeline: ReadingPipeline) -> None:
              self.pipeline = pipeline

          def replay(self, frames: list[bytes]) -> None:
              for frame in frames:
                  self.pipeline.run(frame)
  expected_output:
    outcome: valid
