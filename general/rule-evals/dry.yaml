- name: a module function recomputes the trial end the subscription already computes
  inputs:
    file: accounts/reminders.py
    unchanged:
      accounts/__init__.py: ""
      accounts/subscription.py: |
        from dataclasses import dataclass
        from datetime import date, timedelta


        @dataclass(frozen=True)
        class Subscription:
            started_on: date
            trial_days: int
            extended_days: int

            def trial_ends_on(self) -> date:
                return self.started_on + timedelta(days=self.trial_days + self.extended_days)
    before: |
      from accounts.subscription import Subscription
    after: |
      from datetime import date, timedelta

      from accounts.subscription import Subscription


      def reminder_date(subscription: Subscription) -> date:
          trial_end = subscription.started_on + timedelta(
              days=subscription.trial_days + subscription.extended_days
          )
          return trial_end - timedelta(days=3)
