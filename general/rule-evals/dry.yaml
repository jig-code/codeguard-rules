- name: a retry parses, validates and writes the upload itself, so a new import stage skips retried uploads
  inputs:
    file: src/imports/retry.ts
    unchanged:
      src/imports/importJob.ts: |
        import type { Parser } from "./parser";
        import type { Validator } from "./validator";
        import type { Writer } from "./writer";

        export class ImportJob {
          constructor(
            readonly parser: Parser,
            readonly validator: Validator,
            readonly writer: Writer,
          ) {}

          async run(upload: Buffer): Promise<void> {
            const records = this.parser.parse(upload);
            const accepted = this.validator.check(records);
            await this.writer.write(accepted);
          }
        }
    before: |
      import type { ImportJob } from "./importJob";

      export class RetryQueue {
        constructor(private readonly job: ImportJob) {}
      }
    after: |
      import type { ImportJob } from "./importJob";

      export class RetryQueue {
        constructor(private readonly job: ImportJob) {}

        async retry(failed: Buffer[]): Promise<void> {
          for (const upload of failed) {
            const records = this.job.parser.parse(upload);
            const accepted = this.job.validator.check(records);
            await this.job.writer.write(accepted);
          }
        }
      }
  expected_output:
    outcome: invalid
