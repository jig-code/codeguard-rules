- name: a dispatch service calls a method on the shipment its repository returns
  inputs:
    file: shipping/dispatch.py
    unchanged:
      shipping/shipments.py: |
        class Shipment:
            def __init__(self, shipment_id: int) -> None:
                self.shipment_id = shipment_id
                self.dispatched = False

            def dispatch(self) -> None:
                self.dispatched = True


        class ShipmentRepository:
            def __init__(self) -> None:
                self._by_id: dict[int, Shipment] = {}

            def get(self, shipment_id: int) -> Shipment:
                return self._by_id[shipment_id]
    after: |
      from shipping.shipments import ShipmentRepository


      class DispatchService:
          def __init__(self, shipments: ShipmentRepository) -> None:
              self._shipments = shipments

          def dispatch(self, shipment_id: int) -> None:
              self._shipments.get(shipment_id).dispatch()
  expected_output:
    outcome: valid
- name: a view queries the signed-in user's Django groups for editors
  inputs:
    file: articles/views.py
    after: |
      from django.http import HttpRequest, JsonResponse


      def permissions(request: HttpRequest) -> JsonResponse:
          can_edit = request.user.groups.filter(name="editors").exists()
          return JsonResponse({"can_edit": can_edit})
  expected_output:
    outcome: valid
- name: a sender header uses a standard-library module path and an enum member's value
  inputs:
    file: mail/headers.py
    after: |
      import email.utils
      from enum import Enum


      class Sender(Enum):
          SUPPORT = "support@example.com"
          BILLING = "billing@example.com"


      def support_from_header(display_name: str) -> str:
          return email.utils.formataddr((display_name, Sender.SUPPORT.value))
  expected_output:
    outcome: valid
- name: a query chains a SQLAlchemy select through where, order_by and limit
  inputs:
    file: library/queries.py
    unchanged:
      library/models.py: |
        from datetime import date

        from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column


        class Base(DeclarativeBase):
            pass


        class Book(Base):
            __tablename__ = "books"

            id: Mapped[int] = mapped_column(primary_key=True)
            author_id: Mapped[int]
            title: Mapped[str]
            published_on: Mapped[date]
    after: |
      from sqlalchemy import Select, select

      from library.models import Book


      def latest_books(author_id: int, count: int) -> Select[tuple[Book]]:
          return (
              select(Book)
              .where(Book.author_id == author_id)
              .order_by(Book.published_on.desc())
              .limit(count)
          )
  expected_output:
    outcome: valid
