- name: a check-in service builds a boarding pass from the booking's fields among its other work
  inputs:
    file: checkin/service.ts
    unchanged:
      boarding/pass.ts: |
        export class BoardingPass {
          constructor(
            readonly passenger: string,
            readonly flight: string,
            readonly seat: string,
          ) {}
        }
    after: |
      import { BoardingPass } from "../boarding/pass";
      import type { Booking, BookingStore, PassPrinter } from "./ports";

      export class CheckInService {
        constructor(private readonly bookings: BookingStore, private readonly printer: PassPrinter) {}

        async checkIn(reference: string): Promise<void> {
          const booking = await this.bookings.find(reference);
          const pass = new BoardingPass(booking.passengerName, booking.flightNumber, booking.seat);
          await this.bookings.markCheckedIn(reference);
          await this.printer.print(pass);
        }
      }
  expected_output:
    outcome: invalid
- name: a check-in service has the boarding pass's static constructor build it from the booking
  inputs:
    file: checkin/service.ts
    unchanged:
      boarding/pass.ts: |
        import type { Booking } from "../checkin/ports";

        export class BoardingPass {
          constructor(
            readonly passenger: string,
            readonly flight: string,
            readonly seat: string,
          ) {}

          static forBooking(booking: Booking): BoardingPass {
            return new BoardingPass(booking.passengerName, booking.flightNumber, booking.seat);
          }
        }
    after: |
      import { BoardingPass } from "../boarding/pass";
      import type { BookingStore, PassPrinter } from "./ports";

      export class CheckInService {
        constructor(private readonly bookings: BookingStore, private readonly printer: PassPrinter) {}

        async checkIn(reference: string): Promise<void> {
          const booking = await this.bookings.find(reference);
          await this.bookings.markCheckedIn(reference);
          await this.printer.print(BoardingPass.forBooking(booking));
        }
      }
  expected_output:
    outcome: valid
- name: a profile handler fills in a missing theme with light when it builds the stored profile
  inputs:
    file: profiles/handler.ts
    unchanged:
      profiles/profile.ts: |
        export interface Profile {
          userId: string;
          displayName: string;
          theme: "light" | "dark";
        }
    after: |
      import type { Profile } from "./profile";
      import type { ProfileStore } from "./store";

      interface ProfileInput {
        displayName: string;
        theme?: "light" | "dark";
      }

      export async function saveProfile(store: ProfileStore, userId: string, input: ProfileInput): Promise<void> {
        const profile: Profile = {
          userId,
          displayName: input.displayName.trim(),
          theme: input.theme ?? "light",
        };
        await store.put(profile);
      }
  expected_output:
    outcome: invalid
- name: a cart totals function returns a literal of the totals it worked out
  inputs:
    file: cart/totals.ts
    after: |
      export interface CartTotals {
        itemCount: number;
        subtotalCents: number;
      }

      export function cartTotals(lines: { quantity: number; unitCents: number }[]): CartTotals {
        const itemCount = lines.reduce((sum, line) => sum + line.quantity, 0);
        const subtotalCents = lines.reduce((sum, line) => sum + line.quantity * line.unitCents, 0);
        return { itemCount, subtotalCents };
      }
  expected_output:
    outcome: valid
