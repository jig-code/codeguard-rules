- name: a lending service throws a refusal error carrying the member's id
  inputs:
    file: library/lending.ts
    unchanged:
      library/errors.ts: |
        export class LoanRefused extends Error {
          constructor(readonly memberId: number, readonly reason: string) {
            super(`member ${memberId}: ${reason}`);
          }
        }
    after: |
      import { LoanRefused } from "./errors";
      import type { LoanRepository, Member } from "./ports";

      export class LendingService {
        constructor(private readonly loans: LoanRepository) {}

        async checkCanBorrow(member: Member): Promise<void> {
          if ((await this.loans.overdueCount(member.id)) > 0) {
            throw new LoanRefused(member.id, "has overdue books");
          }
        }
      }
  expected_output:
    outcome: valid
- name: a fine calculation returns the fine it worked out as its answer
  inputs:
    file: library/fines.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from datetime import date
        from decimal import Decimal


        @dataclass(frozen=True)
        class Fine:
            days_late: int
            amount: Decimal
    after: |
      from datetime import date
      from decimal import Decimal

      from library.models import Fine


      def fine_for(due_on: date, returned_on: date) -> Fine:
          days_late = max((returned_on - due_on).days, 0)
          amount = min(Decimal("0.25") * days_late, Decimal("10.00"))
          return Fine(days_late=days_late, amount=Decimal(amount))
  expected_output:
    outcome: valid
