cases:
- name: a lending service builds a loan from the book and member fields among its other work
  inputs:
    file: library/lending.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from datetime import date


        @dataclass(frozen=True)
        class Loan:
            book_id: int
            member_id: int
            due_on: date
    after: |
      from datetime import date, timedelta

      from library.models import Loan
      from library.repositories import LoanRepository
      from library.mail import Mailer


      class LendingService:
          def __init__(self, loans: LoanRepository, mailer: Mailer) -> None:
              self.loans = loans
              self.mailer = mailer

          def lend(self, book, member, today: date) -> None:
              loan = Loan(book_id=book.id, member_id=member.id, due_on=today + timedelta(days=21))
              self.loans.add(loan)
              self.mailer.send_due_date(member.email, loan.due_on)
  expected_output:
    outcome: invalid
- name: a lending service has the loan's own constructor build it and then stores and mails it
  inputs:
    file: library/lending.py
    unchanged:
      library/__init__.py: ""
      library/models.py: |
        from dataclasses import dataclass
        from datetime import date, timedelta


        @dataclass(frozen=True)
        class Loan:
            book_id: int
            member_id: int
            due_on: date

            @classmethod
            def start(cls, book, member, today: date) -> "Loan":
                return cls(book_id=book.id, member_id=member.id, due_on=today + timedelta(days=21))
    after: |
      from datetime import date

      from library.models import Loan
      from library.repositories import LoanRepository
      from library.mail import Mailer


      class LendingService:
          def __init__(self, loans: LoanRepository, mailer: Mailer) -> None:
              self.loans = loans
              self.mailer = mailer

          def lend(self, book, member, today: date) -> None:
              loan = Loan.start(book, member, today=today)
              self.loans.add(loan)
              self.mailer.send_due_date(member.email, loan.due_on)
  expected_output:
    outcome: valid
- name: a Stripe mapping module translates a charge payload into a payment
  inputs:
    file: payments/stripe_mapping.py
    unchanged:
      payments/__init__.py: ""
      payments/models.py: |
        from dataclasses import dataclass
        from decimal import Decimal


        @dataclass(frozen=True)
        class Payment:
            reference: str
            amount: Decimal
            currency: str
            card_last4: str
    after: |
      from decimal import Decimal
      from typing import Any

      from payments.models import Payment


      def payment_from_charge(charge: dict[str, Any]) -> Payment:
          return Payment(
              reference=charge["id"],
              amount=Decimal(charge["amount"]) / 100,
              currency=charge["currency"].upper(),
              card_last4=charge["payment_method_details"]["card"]["last4"],
          )
  expected_output:
    outcome: valid
