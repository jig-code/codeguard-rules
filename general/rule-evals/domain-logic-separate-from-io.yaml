cases:
- name: the refund window is decided beside the order query, so testing the window needs a database
  inputs:
    file: shop/refunds.py
    after: |
      from datetime import date, timedelta

      from shop.models import Order, Refund

      REFUND_WINDOW = timedelta(days=30)


      def request_refund(order_id: int, today: date) -> Refund | None:
          order = Order.objects.get(pk=order_id)
          if order.status != "delivered" or today - order.delivered_on > REFUND_WINDOW:
              return None
          return Refund.objects.create(order=order, amount=order.total)
  expected_output:
    outcome: invalid
- name: the refund view asks the refund policy, so the window is tested with plain orders
  inputs:
    file: shop/refunds.py
    unchanged:
      shop/refund_policy.py: |
        from datetime import date, timedelta

        from shop.models import Order

        REFUND_WINDOW = timedelta(days=30)


        def refund_allowed(order: Order, today: date) -> bool:
            return order.status == "delivered" and today - order.delivered_on <= REFUND_WINDOW
    after: |
      from datetime import date

      from shop.models import Order, Refund
      from shop.refund_policy import refund_allowed


      def request_refund(order_id: int, today: date) -> Refund | None:
          order = Order.objects.get(pk=order_id)
          if not refund_allowed(order, today):
              return None
          return Refund.objects.create(order=order, amount=order.total)
  expected_output:
    outcome: valid
- name: an invoice reads today's date to decide it is overdue, so no test can pin the day
  inputs:
    file: billing/invoices.py
    after: |
      from dataclasses import dataclass
      from datetime import date

      GRACE_DAYS = 14


      @dataclass(frozen=True)
      class Invoice:
          due_on: date
          paid: bool


      def is_overdue(invoice: Invoice) -> bool:
          return not invoice.paid and (date.today() - invoice.due_on).days > GRACE_DAYS
  expected_output:
    outcome: invalid
- name: an invoice is overdue by the date it is given, so a test passes any day
  inputs:
    file: billing/invoices.py
    after: |
      from dataclasses import dataclass
      from datetime import date

      GRACE_DAYS = 14


      @dataclass(frozen=True)
      class Invoice:
          due_on: date
          paid: bool


      def is_overdue(invoice: Invoice, today: date) -> bool:
          return not invoice.paid and (today - invoice.due_on).days > GRACE_DAYS
  expected_output:
    outcome: valid
- name: a room counts its bookings with a query to decide it has space, so the capacity rule needs a database
  inputs:
    file: venues/models.py
    after: |
      from datetime import date

      from django.db import models


      class Room(models.Model):
          capacity = models.PositiveIntegerField()

          def has_space_on(self, day: date) -> bool:
              booked = Booking.objects.filter(room=self, day=day).count()
              return booked < self.capacity


      class Booking(models.Model):
          room = models.ForeignKey(Room, on_delete=models.CASCADE)
          day = models.DateField()
  expected_output:
    outcome: invalid
- name: a room decides it has space from its own loaded fields
  inputs:
    file: venues/models.py
    after: |
      from django.db import models


      class Room(models.Model):
          capacity = models.PositiveIntegerField()
          seats_booked = models.PositiveIntegerField(default=0)

          def has_space(self) -> bool:
              return self.seats_booked < self.capacity
  expected_output:
    outcome: valid
- name: the members client turns the service's not-found and error answers into exceptions
  inputs:
    file: loyalty/client.py
    after: |
