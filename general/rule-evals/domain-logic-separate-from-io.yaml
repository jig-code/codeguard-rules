- name: the new search rollout draws its own random number, so no test can pin which shoppers get it
  inputs:
    file: search/rollout.py
    after: |
      import random
      from dataclasses import dataclass

      NEW_SEARCH_SHARE = 0.1


      @dataclass(frozen=True)
      class Shopper:
          is_staff: bool
          opted_out_of_trials: bool


      def sees_new_search(shopper: Shopper) -> bool:
