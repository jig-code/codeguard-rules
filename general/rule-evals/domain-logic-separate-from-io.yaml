- name: the survey prompt draws its own random number, so no test can pin which customers see it
  inputs:
    file: src/feedback/survey.ts
    after: |
      const SURVEY_SAMPLE_RATE = 0.2;
      const SURVEY_FROM_ORDERS = 3;

      export interface Customer {
        completedOrders: number;
        surveyedThisYear: boolean;
      }

      export function offerSurvey(customer: Customer): boolean {
        return (
          customer.completedOrders >= SURVEY_FROM_ORDERS &&
          !customer.surveyedThisYear &&
          Math.random() < SURVEY_SAMPLE_RATE
        );
      }
  expected_output:
