cases:
- name: the refund window is decided beside the order query, so testing the window needs a database
  inputs:
    file: shop/refunds.py
    after: |
      from datetime import date, timedelta

      from shop.models import Order

      REFUND_WINDOW = timedelta(days=30)


      def refund_allowed(order_id: int, today: date) -> bool:
          order = Order.objects.get(pk=order_id)
          return order.status == "delivered" and today - order.delivered_on <= REFUND_WINDOW
  expected_output:
    outcome: invalid
- name: the refund view reads the order and asks the refund policy, so the window is tested with plain orders
  inputs:
    file: shop/refunds.py
    unchanged:
      shop/refund_policy.py: |
        from datetime import date, timedelta

        from shop.models import Order

        REFUND_WINDOW = timedelta(days=30)


        def refund_allowed(order: Order, today: date) -> bool:
            return order.status == "delivered" and today - order.delivered_on <= REFUND_WINDOW
    after: |
      from datetime import date

      from shop.models import Order, Refund
      from shop.refund_policy import refund_allowed


      def request_refund(order_id: int, today: date) -> Refund | None:
          order = Order.objects.get(pk=order_id)
          if not refund_allowed(order, today):
              return None
          return Refund.objects.create(order=order, amount=order.total)
  expected_output:
    outcome: valid
- name: an invoice reads today's date to decide it is overdue, so no test can pin the day
  inputs:
    file: billing/invoices.py
    after: |
      from dataclasses import dataclass
      from datetime import date

      GRACE_DAYS = 14


      @dataclass(frozen=True)
      class Invoice:
          due_on: date
          paid: bool


      def is_overdue(invoice: Invoice) -> bool:
          return not invoice.paid and (date.today() - invoice.due_on).days > GRACE_DAYS
  expected_output:
    outcome: invalid
- name: an invoice is overdue by the date it is given, so a test passes on any day
  inputs:
    file: billing/invoices.py
    after: |
      from dataclasses import dataclass
      from datetime import date

      GRACE_DAYS = 14


      @dataclass(frozen=True)
      class Invoice:
          due_on: date
          paid: bool


      def is_overdue(invoice: Invoice, today: date) -> bool:
          return not invoice.paid and (today - invoice.due_on).days > GRACE_DAYS
  expected_output:
    outcome: valid
- name: a parcel's size class is decided and written to the database in one function, so the size limits need a database to test
  inputs:
    file: parcels/sizing.py
    unchanged:
      parcels/models.py: |
        from django.db import models


        class SizeClass(models.TextChoices):
            STANDARD = "standard"
            OVERSIZE = "oversize"


        class Parcel(models.Model):
            size_class = models.CharField(max_length=16, choices=SizeClass.choices)
    after: |
      from decimal import Decimal

      from parcels.models import Parcel, SizeClass

      OVERSIZE_FROM_KG = Decimal("30")
      OVERSIZE_FROM_CM = 120


      def record_size_class(parcel_id: int, weight_kg: Decimal, longest_side_cm: int) -> None:
          if weight_kg >= OVERSIZE_FROM_KG or longest_side_cm >= OVERSIZE_FROM_CM:
              size_class = SizeClass.OVERSIZE
          else:
              size_class = SizeClass.STANDARD
          Parcel.objects.filter(pk=parcel_id).update(size_class=size_class)
  expected_output:
    outcome: invalid
- name: the members client turns the service's not-found answer into an exception and decides nothing of the domain
  inputs:
    file: loyalty/client.py
    after: |
      import httpx


      class UnknownMember(Exception):
          pass


      def close_member_account(client: httpx.Client, member_id: str) -> None:
          response = client.delete(f"/members/{member_id}")
          if response.status_code == 404:
              raise UnknownMember(member_id)
          response.raise_for_status()
  expected_output:
    outcome: valid
- name: an edit that only adds an import touches no function, so the judge is not called
  inputs:
    file: shop/views.py
    before: |
      from shop.refunds import request_refund
    after: |
      from shop.refund_policy import refund_allowed
      from shop.refunds import request_refund
  expected_output:
    outcome: skipped
- name: the shipping handler works out free shipping from the cart it just queried, so the threshold needs a database to test
  inputs:
    file: src/checkout/shippingQuote.ts
    unchanged:
      src/db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
    after: |
      import type { Request, Response } from "express";
      import { prisma } from "../db";

      const FREE_SHIPPING_FROM_CENTS = 5000;
      const STANDARD_SHIPPING_CENTS = 499;

      export async function shippingQuote(req: Request, res: Response): Promise<void> {
        const cart = await prisma.cart.findUniqueOrThrow({
          where: { id: req.params.cartId },
          include: { items: true },
        });
        const subtotal = cart.items.reduce((sum, item) => sum + item.priceCents * item.quantity, 0);
        const shippingCents =
          subtotal >= FREE_SHIPPING_FROM_CENTS || cart.memberTier === "plus" ? 0 : STANDARD_SHIPPING_CENTS;
        res.json({ shippingCents });
      }
  expected_output:
    outcome: invalid
- name: the shipping handler queries the cart and asks the shipping rules for the charge, so the threshold is tested with plain carts
  inputs:
    file: src/checkout/shippingQuote.ts
    unchanged:
      src/db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
      src/checkout/shipping.ts: |
        export interface CartLine {
          priceCents: number;
          quantity: number;
        }

        export interface Cart {
          memberTier: string;
          items: CartLine[];
        }

        const FREE_SHIPPING_FROM_CENTS = 5000;
        const STANDARD_SHIPPING_CENTS = 499;

        export function shippingFor(cart: Cart): number {
          const subtotal = cart.items.reduce((sum, item) => sum + item.priceCents * item.quantity, 0);
          return subtotal >= FREE_SHIPPING_FROM_CENTS || cart.memberTier === "plus" ? 0 : STANDARD_SHIPPING_CENTS;
        }
    after: |
      import type { Request, Response } from "express";
      import { prisma } from "../db";
      import { shippingFor } from "./shipping";

      export async function shippingQuote(req: Request, res: Response): Promise<void> {
        const cart = await prisma.cart.findUniqueOrThrow({
          where: { id: req.params.cartId },
          include: { items: true },
        });
        res.json({ shippingCents: shippingFor(cart) });
      }
  expected_output:
    outcome: valid
- name: the survey prompt draws its own random number, so no test can pin which customers see it
  inputs:
    file: src/feedback/survey.ts
    after: |
      const SURVEY_SAMPLE_RATE = 0.2;
      const SURVEY_FROM_ORDERS = 3;

      export interface Customer {
        completedOrders: number;
        surveyedThisYear: boolean;
      }

      export function offerSurvey(customer: Customer): boolean {
        return (
          customer.completedOrders >= SURVEY_FROM_ORDERS &&
          !customer.surveyedThisYear &&
          Math.random() < SURVEY_SAMPLE_RATE
        );
      }
  expected_output:
    outcome: invalid
- name: the survey prompt is decided by the draw it is given, so a test can pin which customers see it
  inputs:
    file: src/feedback/survey.ts
    after: |
      const SURVEY_SAMPLE_RATE = 0.2;
      const SURVEY_FROM_ORDERS = 3;

      export interface Customer {
        completedOrders: number;
        surveyedThisYear: boolean;
      }

      export function offerSurvey(customer: Customer, draw: number): boolean {
        return (
          customer.completedOrders >= SURVEY_FROM_ORDERS &&
          !customer.surveyedThisYear &&
          draw < SURVEY_SAMPLE_RATE
        );
      }
  expected_output:
    outcome: valid
- name: payment routing decides manual review and sends the payment to the queue in one function, so the review rule needs a fake queue to test
  inputs:
    file: src/payments/routing.ts
    unchanged:
      src/queue.ts: |
        export interface QueueClient {
          send(queueName: string, body: object): Promise<void>;
        }
    after: |
      import type { QueueClient } from "../queue";

      const REVIEW_FROM_CENTS = 100_000;

      export interface Payment {
        id: string;
        amountCents: number;
        cardCountry: string;
        billingCountry: string;
      }

      export async function routePayment(payment: Payment, queue: QueueClient): Promise<void> {
        const needsReview = payment.amountCents >= REVIEW_FROM_CENTS || payment.cardCountry !== payment.billingCountry;
        await queue.send(needsReview ? "manual-review" : "settlement", payment);
      }
  expected_output:
    outcome: invalid
- name: the keys client turns the service's unknown-key answer into an exception and decides nothing of the domain
  inputs:
    file: src/auth/keysClient.ts
    after: |
      export class UnknownApiKey extends Error {}

      export async function revokeApiKey(keyId: string): Promise<void> {
        const response = await fetch(`https://keys.example.com/v1/keys/${keyId}`, { method: "DELETE" });
        if (response.status === 404) {
          throw new UnknownApiKey(keyId);
        }
        if (!response.ok) {
          throw new Error(`keys service answered ${response.status}`);
        }
      }
  expected_output:
    outcome: valid
