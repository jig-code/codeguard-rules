- name: the shipping handler works out free shipping from the cart it just queried, so the threshold needs a database to test
  inputs:
    file: src/checkout/shippingQuote.ts
    unchanged:
      src/db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
    after: |
      import type { Request, Response } from "express";
      import { prisma } from "../db";

      const FREE_SHIPPING_FROM_CENTS = 5000;
      const STANDARD_SHIPPING_CENTS = 499;

      export async function shippingQuote(req: Request, res: Response): Promise<void> {
        const cart = await prisma.cart.findUniqueOrThrow({
          where: { id: req.params.cartId },
          include: { items: true },
        });
        const subtotal = cart.items.reduce((sum, item) => sum + item.priceCents * item.quantity, 0);
        const shippingCents =
          subtotal >= FREE_SHIPPING_FROM_CENTS || cart.memberTier === "plus" ? 0 : STANDARD_SHIPPING_CENTS;
        res.json({ shippingCents });
      }
  expected_output:
    outcome: invalid
- name: the shipping handler queries the cart and asks the shipping rules for the charge
  inputs:
    file: src/checkout/shippingQuote.ts
    unchanged:
      src/db.ts: |
        import { PrismaClient } from "@prisma/client";

        export const prisma = new PrismaClient();
      src/checkout/shipping.ts: |
        export interface CartLine {
          priceCents: number;
          quantity: number;
        }

        export interface Cart {
          memberTier: string;
          items: CartLine[];
        }

        const FREE_SHIPPING_FROM_CENTS = 5000;
        const STANDARD_SHIPPING_CENTS = 499;

        export function shippingFor(cart: Cart): number {
          const subtotal = cart.items.reduce((sum, item) => sum + item.priceCents * item.quantity, 0);
          return subtotal >= FREE_SHIPPING_FROM_CENTS || cart.memberTier === "plus" ? 0 : STANDARD_SHIPPING_CENTS;
        }
    after: |
      import type { Request, Response } from "express";
      import { prisma } from "../db";
      import { shippingFor } from "./shipping";

      export async function shippingQuote(req: Request, res: Response): Promise<void> {
        const cart = await prisma.cart.findUniqueOrThrow({
          where: { id: req.params.cartId },
          include: { items: true },
        });
        res.json({ shippingCents: shippingFor(cart) });
      }
  expected_output:
    outcome: valid
- name: a trial reads the clock to decide it has ended, so no test can pin the moment
  inputs:
    file: src/accounts/trial.ts
    after: |
      const TRIAL_DAYS = 14;
      const DAY_MS = 86_400_000;

      export interface Account {
        createdAt: Date;
        subscribed: boolean;
      }

      export function trialHasEnded(account: Account): boolean {
        return !account.subscribed && Date.now() - account.createdAt.getTime() > TRIAL_DAYS * DAY_MS;
      }
  expected_output:
    outcome: invalid
- name: a trial has ended by the time it is given, so a test passes at any moment
  inputs:
    file: src/accounts/trial.ts
    after: |
      const TRIAL_DAYS = 14;
      const DAY_MS = 86_400_000;

      export interface Account {
        createdAt: Date;
        subscribed: boolean;
      }

      export function trialHasEnded(account: Account, now: Date): boolean {
        return !account.subscribed && now.getTime() - account.createdAt.getTime() > TRIAL_DAYS * DAY_MS;
      }
  expected_output:
    outcome: valid
- name: loan approval asks the credit bureau and applies the score and income limits in one method, so the limits need a fake bureau to test
  inputs:
    file: src/lending/approvals.ts
    unchanged:
      src/lending/creditBureau.ts: |
        import { z } from "zod";

        const creditReport = z.object({
          score: z.number().int(),
          annualIncomeCents: z.number().int(),
        });

        export type CreditReport = z.infer<typeof creditReport>;

        export class CreditBureauClient {
          constructor(private readonly baseUrl: string) {}

          async report(applicantId: string): Promise<CreditReport> {
            const response = await fetch(`${this.baseUrl}/reports/${applicantId}`);
            if (!response.ok) {
              throw new Error(`credit bureau answered ${response.status}`);
            }
            return creditReport.parse(await response.json());
          }
        }
    after: |
      import type { CreditBureauClient } from "./creditBureau";

      export interface LoanApplication {
        applicantId: string;
        amountCents: number;
      }

      export class LoanApprovals {
        constructor(private readonly bureau: CreditBureauClient) {}

        async approve(application: LoanApplication): Promise<boolean> {
          const report = await this.bureau.report(application.applicantId);
          return report.score >= 680 && application.amountCents <= report.annualIncomeCents * 0.4;
        }
      }
  expected_output:
    outcome: invalid
- name: the keys client turns the service's unknown-key and error answers into exceptions
  inputs:
    file: src/auth/keysClient.ts
    after: |
      export class UnknownApiKey extends Error {}

      export async function revokeApiKey(keyId: string): Promise<void> {
        const response = await fetch(`https://keys.example.com/v1/keys/${keyId}`, { method: "DELETE" });
        if (response.status === 404) {
          throw new UnknownApiKey(keyId);
        }
        if (!response.ok) {
          throw new Error(`keys service answered ${response.status}`);
        }
      }
  expected_output:
    outcome: valid
- name: the tracking export reader checks each scan's fields and formats where it reads the file
  inputs:
    file: src/carriers/trackingExport.ts
    after: |
      import { readFile } from "node:fs/promises";
      import { z } from "zod";

      const scan = z.object({
        trackingNumber: z.string().regex(/^1Z[0-9A-Z]{16}$/),
        depot: z.string(),
        scannedAt: z.string().datetime(),
      });

      const trackingExport = z.object({ scans: z.array(scan) });

      export type TrackingExport = z.infer<typeof trackingExport>;

      export async function readTrackingExport(path: string): Promise<TrackingExport> {
        return trackingExport.parse(JSON.parse(await readFile(path, "utf8")));
      }
  expected_output:
    outcome: valid
- name: a subscription decides it can pause from its own fields
  inputs:
    file: src/billing/subscription.ts
    after: |
      const MAX_PAUSES_PER_YEAR = 2;

      export class Subscription {
        constructor(
          readonly status: "active" | "paused" | "cancelled",
          readonly pausesThisYear: number,
        ) {}

        canPause(): boolean {
          return this.status === "active" && this.pausesThisYear < MAX_PAUSES_PER_YEAR;
        }
      }
  expected_output:
    outcome: valid
- name: payment routing decides manual review and sends the payment to the queue in one function, so the review rule needs a fake queue to test
  inputs:
    file: src/payments/routing.ts
    unchanged:
      src/queue.ts: |
        export interface QueueClient {
          send(queueName: string, body: object): Promise<void>;
        }
    after: |
      import type { QueueClient } from "../queue";

      const REVIEW_FROM_CENTS = 100_000;

      export interface Payment {
        id: string;
        amountCents: number;
        cardCountry: string;
        billingCountry: string;
      }

      export async function routePayment(payment: Payment, queue: QueueClient): Promise<void> {
        const needsReview = payment.amountCents >= REVIEW_FROM_CENTS || payment.cardCountry !== payment.billingCountry;
        await queue.send(needsReview ? "manual-review" : "settlement", payment);
      }
  expected_output:
    outcome: invalid
- name: payment routing asks the review rule and picks the queue from its answer, so the rule is tested without a queue
  inputs:
    file: src/payments/routing.ts
    unchanged:
      src/queue.ts: |
        export interface QueueClient {
          send(queueName: string, body: object): Promise<void>;
        }
      src/payments/review.ts: |
        const REVIEW_FROM_CENTS = 100_000;

        export interface Payment {
          id: string;
          amountCents: number;
          cardCountry: string;
          billingCountry: string;
        }

        export function needsManualReview(payment: Payment): boolean {
          return payment.amountCents >= REVIEW_FROM_CENTS || payment.cardCountry !== payment.billingCountry;
        }
    after: |
      import type { QueueClient } from "../queue";
      import { needsManualReview, type Payment } from "./review";

      export async function routePayment(payment: Payment, queue: QueueClient): Promise<void> {
        await queue.send(needsManualReview(payment) ? "manual-review" : "settlement", payment);
      }
  expected_output:
    outcome: valid
- name: an overdraft fee is decided from the overdraft it is given, and counting waived fees in a metric does not make it I/O
  inputs:
    file: src/banking/overdraftFee.ts
    after: |
      import { Counter } from "prom-client";

      const WAIVE_UNDER_CENTS = 2_000;
      const OVERDRAFT_FEE_CENTS = 3_500;

      const waivedFees = new Counter({ name: "overdraft_fees_waived_total", help: "Overdraft fees waived" });

      export interface Overdraft {
        amountCents: number;
        firstThisYear: boolean;
      }

      export function overdraftFeeCents(overdraft: Overdraft): number {
        if (overdraft.firstThisYear || overdraft.amountCents < WAIVE_UNDER_CENTS) {
          waivedFees.inc();
          return 0;
        }
        return OVERDRAFT_FEE_CENTS;
      }
  expected_output:
    outcome: valid
