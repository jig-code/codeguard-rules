- name: a class cancellation fee is worked out from the times it is given, and logging the fee does not make it I/O
  inputs:
    file: studio/cancellations.py
    after: |
      import logging
      from dataclasses import dataclass
      from datetime import datetime, timedelta

      logger = logging.getLogger(__name__)

      FREE_CANCELLATION_BEFORE = timedelta(hours=12)
      LATE_CANCELLATION_FEE_CENTS = 800


      @dataclass(frozen=True)
      class ClassBooking:
          booking_id: int
          class_starts_at: datetime


      def cancellation_fee_cents(booking: ClassBooking, cancelled_at: datetime) -> int:
          if booking.class_starts_at - cancelled_at >= FREE_CANCELLATION_BEFORE:
              return 0
          logger.info("late cancellation fee charged for booking %d", booking.booking_id)
          return LATE_CANCELLATION_FEE_CENTS
  expected_output:
    outcome: valid
