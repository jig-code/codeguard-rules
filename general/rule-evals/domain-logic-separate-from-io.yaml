- name: a parcel's size class is decided and written to the database in one function, so the size limits need a database to test
  inputs:
    file: parcels/sizing.py
    unchanged:
      parcels/models.py: |
        from django.db import models


        class SizeClass(models.TextChoices):
            STANDARD = "standard"
            OVERSIZE = "oversize"


        class Parcel(models.Model):
            size_class = models.CharField(max_length=16, choices=SizeClass.choices)
    after: |
      from decimal import Decimal

      from parcels.models import Parcel, SizeClass

      OVERSIZE_FROM_KG = Decimal("30")
      OVERSIZE_FROM_CM = 120


      def record_size_class(parcel_id: int, weight_kg: Decimal, longest_side_cm: int) -> None:
          if weight_kg >= OVERSIZE_FROM_KG or longest_side_cm >= OVERSIZE_FROM_CM:
              size_class = SizeClass.OVERSIZE
          else:
              size_class = SizeClass.STANDARD
          Parcel.objects.filter(pk=parcel_id).update(size_class=size_class)
  expected_output:
    outcome: invalid
- name: a task decides the membership tier between loading and saving the member, so the tier thresholds need a database to test
  inputs:
    file: loyalty/tasks.py
    after: |
      from celery import shared_task

      from loyalty.models import Member


      @shared_task
      def refresh_tier(member_id: int) -> None:
          member = Member.objects.get(pk=member_id)
          if member.points >= 5000:
              member.tier = "gold"
          elif member.points >= 1000:
              member.tier = "silver"
          else:
              member.tier = "bronze"
          member.save(update_fields=["tier"])
  expected_output:
    outcome: invalid
