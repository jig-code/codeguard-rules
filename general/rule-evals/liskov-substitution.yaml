- name: a tenant session store purges nothing and reports zero where its base removes expired sessions
  inputs:
    file: src/auth/sessions.ts
    after: |
      export interface Session {
        userId: string;
        expiresAt: Date;
      }

      export class SessionStore {
        protected readonly sessions = new Map<string, Session>();

        save(id: string, session: Session): void {
          this.sessions.set(id, session);
        }

        /** Removes every session that expired before `now` and returns how many it removed. */
        purgeExpired(now: Date): number {
          let removed = 0;
          for (const [id, session] of this.sessions) {
            if (session.expiresAt < now) {
              this.sessions.delete(id);
              removed += 1;
            }
          }
          return removed;
        }
      }

      export class TenantSessionStore extends SessionStore {
        constructor(readonly tenant: string) {
          super();
        }

        purgeExpired(_now: Date): number {
          return 0;
        }
      }
  expected_output:
    outcome: invalid
