- name: a seat map with holds raises the SeatUnavailable error its base documents for a seat on hold
  inputs:
    file: venues/seats.py
    after: |
      class SeatUnavailable(Exception):
          pass


      class SeatMap:
          def __init__(self) -> None:
              self.booked: set[str] = set()

          def book(self, seat: str) -> None:
              """Book the seat. Raises SeatUnavailable if the seat is booked or on hold."""
              if seat in self.booked:
                  raise SeatUnavailable(seat)
              self.booked.add(seat)


      class HoldingSeatMap(SeatMap):
          def __init__(self) -> None:
              super().__init__()
              self.held: set[str] = set()

          def hold(self, seat: str) -> None:
              self.held.add(seat)

          def book(self, seat: str) -> None:
              if seat in self.held:
                  raise SeatUnavailable(seat)
              super().book(seat)
  expected_output:
    outcome: valid
