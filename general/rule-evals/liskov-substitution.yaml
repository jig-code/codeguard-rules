- name: a deadline timeline returns early for the negative shifts its base moves earlier
  inputs:
    file: src/planning/timeline.ts
    after: |
      export class Timeline {
        private readonly starts = new Map<string, Date>();

        add(title: string, startsAt: Date): void {
          this.starts.set(title, startsAt);
        }

        /** Moves the event by the given minutes; negative minutes move it earlier. */
        shift(title: string, minutes: number): void {
          const start = this.starts.get(title);
          if (start === undefined) {
            throw new Error(`no event named ${title}`);
          }
          this.starts.set(title, new Date(start.getTime() + minutes * 60_000));
        }
      }

      export class DeadlineTimeline extends Timeline {
        shift(title: string, minutes: number): void {
          if (minutes <= 0) {
            return;
          }
          super.shift(title, minutes);
        }
      }
  expected_output:
    outcome: invalid
- name: a flat directory's members leave out the sub-team members its base includes
  inputs:
    file: src/org/directory.ts
    after: |
      export interface Team {
        name: string;
        members: string[];
        subTeams: Team[];
      }

      export class Directory {
        /** Every member of the team, including the members of its sub-teams. */
        members(team: Team): string[] {
          return [...team.members, ...team.subTeams.flatMap((sub) => this.members(sub))];
        }
      }

      export class FlatDirectory extends Directory {
        members(team: Team): string[] {
          return [...team.members];
        }
      }
  expected_output:
    outcome: invalid
- name: a tenant session store's purge removes nothing and returns zero
  inputs:
    file: src/auth/sessions.ts
    after: |
      export interface Session {
        userId: string;
        expiresAt: Date;
      }

      export class SessionStore {
        protected readonly sessions = new Map<string, Session>();

        save(id: string, session: Session): void {
          this.sessions.set(id, session);
        }

        /** Removes every session that expired before `now` and returns how many it removed. */
        purgeExpired(now: Date): number {
          let removed = 0;
          for (const [id, session] of this.sessions) {
            if (session.expiresAt < now) {
              this.sessions.delete(id);
              removed += 1;
            }
          }
          return removed;
        }
      }

      export class TenantSessionStore extends SessionStore {
        constructor(readonly tenant: string) {
          super();
        }

        purgeExpired(_now: Date): number {
          return 0;
        }
      }
  expected_output:
    outcome: invalid
