- name: a price list subclass also reads discontinued prices and throws the UnknownSkuError its base throws
  inputs:
    file: src/pricing/priceList.ts
    after: |
      export class UnknownSkuError extends Error {
        constructor(readonly sku: string) {
          super(`no price for ${sku}`);
        }
      }

      export class PriceList {
        constructor(protected readonly prices: ReadonlyMap<string, number>) {}

        /** The price in cents. Throws UnknownSkuError when the SKU has no price. */
        priceCents(sku: string): number {
          const price = this.prices.get(sku);
          if (price === undefined) {
            throw new UnknownSkuError(sku);
          }
          return price;
        }
      }

      export class DiscontinuedPriceList extends PriceList {
        constructor(
          prices: ReadonlyMap<string, number>,
          private readonly lastPrices: ReadonlyMap<string, number>,
        ) {
          super(prices);
        }

        priceCents(sku: string): number {
          const price = this.prices.get(sku) ?? this.lastPrices.get(sku);
          if (price === undefined) {
            throw new UnknownSkuError(sku);
          }
          return price;
        }
      }
  expected_output:
    outcome: valid
