- name: a tracing router resolves through its base router and records the route it found
  inputs:
    file: src/web/router.ts
    after: |
      export interface Route {
        name: string;
        pattern: RegExp;
      }

      export class Router {
        constructor(protected readonly routes: Route[]) {}

        /** The first route whose pattern matches the path, or undefined when none does. */
        resolve(path: string): Route | undefined {
          return this.routes.find((route) => route.pattern.test(path));
        }
      }

      export class TracingRouter extends Router {
        readonly resolved: string[] = [];

        resolve(path: string): Route | undefined {
          const route = super.resolve(path);
          if (route !== undefined) {
            this.resolved.push(route.name);
          }
          return route;
        }
      }
  expected_output:
    outcome: valid
