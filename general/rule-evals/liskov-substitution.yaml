- name: a fake clock for tests reads the time it was set to instead of the system time
  inputs:
    file: src/time/clock.ts
    after: |
      export class SystemClock {
        /** The current time. */
        now(): Date {
          return new Date();
        }
      }

      /** A clock for tests that reads the time it was set to until a test advances it. */
      export class FakeClock extends SystemClock {
        constructor(private current: Date) {
          super();
        }

        now(): Date {
          return this.current;
        }

        advance(ms: number): void {
          this.current = new Date(this.current.getTime() + ms);
        }
      }
  expected_output:
    outcome: valid
