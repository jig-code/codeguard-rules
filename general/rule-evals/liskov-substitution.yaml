cases:
- name: a curated playlist raises an error on removing a pinned track
  inputs:
    file: music/playlists.py
    after: |
      from dataclasses import dataclass, field


      class PlaylistLocked(Exception):
          pass


      @dataclass
      class Playlist:
          tracks: list[str] = field(default_factory=list)

          def remove(self, track: str) -> None:
              """Remove the track if the playlist has it."""
              if track in self.tracks:
                  self.tracks.remove(track)


      @dataclass
      class CuratedPlaylist(Playlist):
          pinned: set[str] = field(default_factory=set)

          def remove(self, track: str) -> None:
              if track in self.pinned:
                  raise PlaylistLocked(f"{track} is pinned to this playlist")
              super().remove(track)
  expected_output:
    outcome: invalid
- name: a paginator subclass takes a page size and cuts pages of 20
  inputs:
    file: listing/pages.py
    after: |
      from typing import Sequence, TypeVar

      T = TypeVar("T")


      class Paginator:
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return items[start : start + size]


      class CatalogPaginator(Paginator):
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * 20
              return items[start : start + 20]
  expected_output:
    outcome: invalid
- name: a gift card wallet returns early for the negative amounts its base takes out
  inputs:
    file: payments/wallets.py
    after: |
      class Wallet:
          def __init__(self) -> None:
              self.balance_cents = 0

          def adjust(self, cents: int) -> None:
              """Add cents to the balance; a negative amount takes them out."""
              self.balance_cents += cents


      class GiftCardWallet(Wallet):
          def adjust(self, cents: int) -> None:
              if cents <= 0:
                  return
              super().adjust(cents)
  expected_output:
    outcome: invalid
- name: a gift order's charges leave out the shipping charge its base lists
  inputs:
    file: shop/orders.py
    after: |
      from dataclasses import dataclass
      from decimal import Decimal


      @dataclass(frozen=True)
      class Charge:
          label: str
          amount: Decimal


      class Order:
          def __init__(self, products: list[Charge], shipping: Decimal) -> None:
              self.products = products
              self.shipping = shipping

          def charges(self) -> list[Charge]:
              """Every charge on the order: its products, then its shipping."""
              return [*self.products, Charge("shipping", self.shipping)]


      class GiftOrder(Order):
          def charges(self) -> list[Charge]:
              return list(self.products)
  expected_output:
    outcome: invalid
- name: a closed ledger's post records nothing and returns zero
  inputs:
    file: accounts/ledger.py
    after: |
      from decimal import Decimal


      class Ledger:
          def __init__(self) -> None:
              self.entries: list[Decimal] = []

          def post(self, amount: Decimal) -> Decimal:
              """Record the amount and return the new balance."""
              self.entries.append(amount)
              return sum(self.entries, Decimal(0))


      class ClosedLedger(Ledger):
          def post(self, amount: Decimal) -> Decimal:
              return Decimal(0)
  expected_output:
    outcome: invalid
- name: a PDF exporter's export raises for every report
  inputs:
    file: reports/exporters.py
    after: |
      from abc import ABC, abstractmethod
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Report:
          title: str
          lines: list[str]


      class Exporter(ABC):
          @abstractmethod
          def export(self, report: Report) -> bytes:
              """Return the report encoded in this exporter's format."""


      class TextExporter(Exporter):
          def export(self, report: Report) -> bytes:
              return "".join(f"{line}\n" for line in [report.title, *report.lines]).encode("utf-8")


      class PdfExporter(Exporter):
          def export(self, report: Report) -> bytes:
              raise NotImplementedError("PDF export isn't available")
  expected_output:
    outcome: invalid
- name: a cached customer directory calls its base's find and remembers the customers found
  inputs:
    file: crm/directory.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Customer:
          id: str
          name: str


      class CustomerDirectory:
          def __init__(self, customers: tuple[Customer, ...]) -> None:
              self.customers = customers

          def find(self, customer_id: str) -> Customer | None:
              """The customer with the id, or None when there is none."""
              for customer in self.customers:
                  if customer.id == customer_id:
                      return customer
              return None


      class CachedCustomerDirectory(CustomerDirectory):
          def __init__(self, customers: tuple[Customer, ...]) -> None:
              super().__init__(customers)
              self._found: dict[str, Customer] = {}

          def find(self, customer_id: str) -> Customer | None:
              if customer_id in self._found:
                  return self._found[customer_id]
              customer = super().find(customer_id)
              if customer is not None:
                  self._found[customer_id] = customer
              return customer
  expected_output:
    outcome: valid
- name: a counted inventory answers stock counts from a running tally
  inputs:
    file: warehouse/inventory.py
    after: |
      from collections import Counter


      class Inventory:
          def __init__(self) -> None:
              self.skus: list[str] = []

          def add(self, sku: str) -> None:
              self.skus.append(sku)

          def count(self, sku: str) -> int:
              return self.skus.count(sku)


      class CountedInventory(Inventory):
          def __init__(self) -> None:
              super().__init__()
              self._counts: Counter[str] = Counter()

          def add(self, sku: str) -> None:
              super().add(sku)
              self._counts[sku] += 1

          def count(self, sku: str) -> int:
              return self._counts[sku]
  expected_output:
    outcome: valid
- name: a paginator subclass accepts any iterable and cuts pages of the size it's given
  inputs:
    file: listing/pages.py
    after: |
      from itertools import islice
      from typing import Iterable, Sequence, TypeVar

      T = TypeVar("T")


      class Paginator:
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return items[start : start + size]


      class StreamPaginator(Paginator):
          def page(self, items: Iterable[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return list(islice(items, start, start + size))
  expected_output:
    outcome: valid
- name: a roster team returns its members as a sorted list where its base declares a collection
  inputs:
    file: org/teams.py
    after: |
      from collections.abc import Collection


      class Team:
          def __init__(self, members: set[str]) -> None:
              self._members = members

          def members(self) -> Collection[str]:
              return frozenset(self._members)


      class RosterTeam(Team):
          def members(self) -> list[str]:
              """The members in alphabetical order, for printing the roster."""
              return sorted(self._members)
  expected_output:
    outcome: valid
- name: a plain text writer implements the abstract render method
  inputs:
    file: reports/writers.py
    after: |
      from abc import ABC, abstractmethod
      from pathlib import Path


      class ReportWriter(ABC):
          @abstractmethod
          def render(self, lines: list[str]) -> str:
              """Return the lines as one document."""

          def write(self, path: Path, lines: list[str]) -> None:
              path.write_text(self.render(lines), encoding="utf-8")


      class PlainTextWriter(ReportWriter):
          def render(self, lines: list[str]) -> str:
              return "".join(f"{line}\n" for line in lines)
  expected_output:
    outcome: valid
- name: a seat map with holds raises the error its base documents for a seat on hold
  inputs:
    file: venues/seats.py
    after: |
      class SeatUnavailable(Exception):
          pass


      class SeatMap:
          def __init__(self) -> None:
              self.booked: set[str] = set()

          def book(self, seat: str) -> None:
              """Book the seat. Raises SeatUnavailable if the seat is booked or on hold."""
              if seat in self.booked:
                  raise SeatUnavailable(seat)
              self.booked.add(seat)


      class HoldingSeatMap(SeatMap):
          def __init__(self) -> None:
              super().__init__()
              self.held: set[str] = set()

          def hold(self, seat: str) -> None:
              self.held.add(seat)

          def book(self, seat: str) -> None:
              if seat in self.held:
                  raise SeatUnavailable(seat)
              super().book(seat)
  expected_output:
    outcome: valid
