- name: a tracing router calls its base's resolve and records the route found
  inputs:
    file: src/web/router.ts
    after: |
      export interface Route {
        name: string;
        pattern: RegExp;
      }

      export class Router {
        constructor(protected readonly routes: Route[]) {}

        /** The first route whose pattern matches the path, or undefined when none does. */
        resolve(path: string): Route | undefined {
          return this.routes.find((route) => route.pattern.test(path));
        }
      }

      export class TracingRouter extends Router {
        readonly resolved: string[] = [];

        resolve(path: string): Route | undefined {
          const route = super.resolve(path);
          if (route !== undefined) {
            this.resolved.push(route.name);
          }
          return route;
        }
      }
  expected_output:
    outcome: valid
- name: an indexed word list answers membership from a set
  inputs:
    file: src/spelling/words.ts
    after: |
      export class WordList {
        constructor(protected readonly words: readonly string[]) {}

        contains(word: string): boolean {
          return this.words.includes(word);
        }
      }

      export class IndexedWordList extends WordList {
        private readonly index: ReadonlySet<string>;

        constructor(words: readonly string[]) {
          super(words);
          this.index = new Set(words);
        }

        contains(word: string): boolean {
          return this.index.has(word);
        }
      }
  expected_output:
    outcome: valid
- name: a multi-line word counter also accepts a list of lines
  inputs:
    file: src/text/counting.ts
    after: |
      export class WordCounter {
        count(text: string): number {
          return text.split(/\s+/).filter((word) => word.length > 0).length;
        }
      }

      export class MultiLineWordCounter extends WordCounter {
        count(text: string | readonly string[]): number {
          return super.count(typeof text === "string" ? text : text.join("\n"));
        }
      }
  expected_output:
    outcome: valid
- name: a sorted plugin registry returns its names as an array where its base declares an iterable
  inputs:
    file: src/plugins/registry.ts
    after: |
      export interface Plugin {
        start(): void;
      }

      export class PluginRegistry {
        protected readonly plugins = new Map<string, Plugin>();

        register(name: string, plugin: Plugin): void {
          this.plugins.set(name, plugin);
        }

        names(): Iterable<string> {
          return this.plugins.keys();
        }
      }

      export class SortedPluginRegistry extends PluginRegistry {
        names(): string[] {
          return [...this.plugins.keys()].sort();
        }
      }
  expected_output:
    outcome: valid
