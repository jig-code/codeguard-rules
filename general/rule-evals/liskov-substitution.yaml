cases:
- name: a curated playlist raises an error its base never raises when asked to remove a pinned track
  inputs:
    file: music/playlists.py
    after: |
      from dataclasses import dataclass, field


      class PlaylistLocked(Exception):
          pass


      @dataclass
      class Playlist:
          tracks: list[str] = field(default_factory=list)

          def remove(self, track: str) -> None:
              """Remove the track if the playlist has it."""
              if track in self.tracks:
                  self.tracks.remove(track)


      @dataclass
      class CuratedPlaylist(Playlist):
          pinned: set[str] = field(default_factory=set)

          def remove(self, track: str) -> None:
              if track in self.pinned:
                  raise PlaylistLocked(f"{track} is pinned to this playlist")
              super().remove(track)
  expected_output:
    outcome: invalid
- name: a paginator subclass takes a page size and always cuts pages of 20
  inputs:
    file: listing/pages.py
    after: |
      from typing import Sequence, TypeVar

      T = TypeVar("T")


      class Paginator:
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return items[start : start + size]


      class CatalogPaginator(Paginator):
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * 20
              return items[start : start + 20]
  expected_output:
    outcome: invalid
