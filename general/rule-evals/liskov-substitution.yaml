- name: a fake payment gateway for tests records charges instead of calling the provider
  inputs:
    file: payments/gateway.py
    after: |
      from decimal import Decimal

      import httpx
      from pydantic import BaseModel


      class ChargeCreated(BaseModel):
          id: str


      class PaymentGateway:
          def __init__(self, client: httpx.Client) -> None:
              self.client = client

          def charge(self, card_token: str, amount: Decimal) -> str:
              """Charge the card and return the provider's charge id."""
              response = self.client.post("/charges", json={"card": card_token, "amount": str(amount)})
              response.raise_for_status()
              return ChargeCreated.model_validate_json(response.content).id


      class FakePaymentGateway(PaymentGateway):
          """Stands in for the gateway in tests: records each charge instead of calling the provider."""

          def __init__(self) -> None:
              self.charged: list[tuple[str, Decimal]] = []

          def charge(self, card_token: str, amount: Decimal) -> str:
              self.charged.append((card_token, amount))
              return f"fake-charge-{len(self.charged)}"
  expected_output:
    outcome: valid
