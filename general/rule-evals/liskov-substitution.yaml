- name: a PDF exporter refuses every report, so the abstract export it supplies can never be called
  inputs:
    file: reports/exporters.py
    after: |
      from abc import ABC, abstractmethod
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Report:
          title: str
          lines: list[str]


      class Exporter(ABC):
          @abstractmethod
          def export(self, report: Report) -> bytes:
              """Return the report encoded in this exporter's format."""


      class TextExporter(Exporter):
          def export(self, report: Report) -> bytes:
              return "".join(f"{line}\n" for line in [report.title, *report.lines]).encode("utf-8")


      class PdfExporter(Exporter):
