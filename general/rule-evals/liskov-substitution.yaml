- name: a deadline timeline silently does nothing for the negative shifts its base moves earlier
  inputs:
    file: src/planning/timeline.ts
    after: |
      export class Timeline {
        private readonly starts = new Map<string, Date>();

        add(title: string, startsAt: Date): void {
          this.starts.set(title, startsAt);
        }

        /** Moves the event by the given minutes; negative minutes move it earlier. */
        shift(title: string, minutes: number): void {
          const start = this.starts.get(title);
          if (start === undefined) {
            throw new Error(`no event named ${title}`);
          }
          this.starts.set(title, new Date(start.getTime() + minutes * 60_000));
        }
      }

      export class DeadlineTimeline extends Timeline {
        shift(title: string, minutes: number): void {
          if (minutes <= 0) {
            return;
          }
          super.shift(title, minutes);
        }
      }
  expected_output:
    outcome: invalid
