- name: a lab temperature's parse classmethod raises for the Fahrenheit readings its base parses
  inputs:
    file: sensors/temperature.py
    after: |
      from dataclasses import dataclass
      from typing import Self


      class UnsupportedUnit(Exception):
          pass


      @dataclass(frozen=True)
      class Temperature:
          celsius: float

          @classmethod
          def parse(cls, text: str) -> Self:
              """Read a reading such as "21C" or "70F"."""
              value, unit = float(text[:-1]), text[-1]
              if unit == "C":
                  return cls(value)
              if unit == "F":
                  return cls((value - 32) * 5 / 9)
              raise ValueError(f"unknown unit in {text!r}")


      @dataclass(frozen=True)
      class LabTemperature(Temperature):
          @classmethod
          def parse(cls, text: str) -> Self:
              if text.endswith("F"):
                  raise UnsupportedUnit("lab readings are in Celsius")
              return super().parse(text)
  expected_output:
    outcome: invalid
- name: a cached customer directory asks its base directory and remembers the customers it found
  inputs:
    file: crm/directory.py
    after: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Customer:
          id: str
          name: str


      class CustomerDirectory:
          def __init__(self, customers: tuple[Customer, ...]) -> None:
              self.customers = customers

          def find(self, customer_id: str) -> Customer | None:
              """The customer with the id, or None when there is none."""
              for customer in self.customers:
                  if customer.id == customer_id:
                      return customer
              return None


      class CachedCustomerDirectory(CustomerDirectory):
          def __init__(self, customers: tuple[Customer, ...]) -> None:
              super().__init__(customers)
              self._found: dict[str, Customer] = {}

          def find(self, customer_id: str) -> Customer | None:
              if customer_id in self._found:
                  return self._found[customer_id]
              customer = super().find(customer_id)
              if customer is not None:
                  self._found[customer_id] = customer
              return customer
  expected_output:
    outcome: valid
- name: a counted inventory answers the same stock count as its base from a running tally
  inputs:
    file: warehouse/inventory.py
    after: |
      from collections import Counter


      class Inventory:
          def __init__(self) -> None:
              self.skus: list[str] = []

          def add(self, sku: str) -> None:
              self.skus.append(sku)

          def count(self, sku: str) -> int:
              return self.skus.count(sku)


      class CountedInventory(Inventory):
          def __init__(self) -> None:
              super().__init__()
              self._counts: Counter[str] = Counter()

          def add(self, sku: str) -> None:
              super().add(sku)
              self._counts[sku] += 1

          def count(self, sku: str) -> int:
              return self._counts[sku]
  expected_output:
    outcome: valid
- name: a paginator subclass cuts pages of the size it's given from any iterable
  inputs:
    file: listing/pages.py
    after: |
      from itertools import islice
      from typing import Iterable, Sequence, TypeVar

      T = TypeVar("T")


      class Paginator:
          def page(self, items: Sequence[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return items[start : start + size]


      class StreamPaginator(Paginator):
          def page(self, items: Iterable[T], number: int, size: int) -> Sequence[T]:
              if number < 1:
                  raise ValueError("pages are numbered from 1")
              start = (number - 1) * size
              return list(islice(items, start, start + size))
  expected_output:
    outcome: valid
