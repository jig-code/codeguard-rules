- name: a plain text writer implements the abstract render method its base leaves to subclasses
  inputs:
    file: reports/writers.py
    after: |
      from abc import ABC, abstractmethod
      from pathlib import Path


      class ReportWriter(ABC):
          @abstractmethod
          def render(self, lines: list[str]) -> str:
              """Return the lines as one document."""

          def write(self, path: Path, lines: list[str]) -> None:
              path.write_text(self.render(lines), encoding="utf-8")


      class PlainTextWriter(ReportWriter):
          def render(self, lines: list[str]) -> str:
              return "".join(f"{line}\n" for line in lines)
  expected_output:
    outcome: valid
- name: a circle computes the area its base shape leaves to subclasses by raising NotImplementedError
  inputs:
    file: geometry/shapes.py
    after: |
      import math


      class Shape:
          def area(self) -> float:
              raise NotImplementedError

          def describe(self) -> str:
              return f"{type(self).__name__} of area {self.area():.2f}"


      class Circle(Shape):
          def __init__(self, radius: float) -> None:
