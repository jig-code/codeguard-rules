cases:
- name: a delivery calculator works out a parcel's shipping cost that the shipping quote already works out
  inputs:
    file: checkout/delivery.py
    unchanged:
      shipping/__init__.py: ""
      shipping/quotes.py: |
        from decimal import Decimal

        from shipping.models import Parcel


        class ShippingQuote:
            def cost(self, parcel: Parcel) -> Decimal:
                base = Decimal("4.50")
                per_kg = Decimal("1.20")
                return base + per_kg * parcel.weight_kg
    after: |
      from decimal import Decimal

      from shipping.models import Parcel


      class DeliveryCalculator:
          def shipping_price(self, parcel: Parcel) -> Decimal:
              price = Decimal("4.50") + Decimal("1.20") * parcel.weight_kg
              return price.quantize(Decimal("0.01"))
  expected_output:
    outcome: invalid
- name: a delivery calculator has the shipping quote work out a parcel's cost and adds packaging
  inputs:
    file: checkout/delivery.py
    unchanged:
      shipping/__init__.py: ""
      shipping/quotes.py: |
        from decimal import Decimal

        from shipping.models import Parcel


        class ShippingQuote:
            def cost(self, parcel: Parcel) -> Decimal:
                base = Decimal("4.50")
                per_kg = Decimal("1.20")
                return base + per_kg * parcel.weight_kg
    after: |
      from decimal import Decimal

      from shipping.models import Parcel
      from shipping.quotes import ShippingQuote


      class DeliveryCalculator:
          def __init__(self, quote: ShippingQuote) -> None:
              self.quote = quote

          def shipping_price(self, parcel: Parcel, gift_wrap: bool) -> Decimal:
              price = self.quote.cost(parcel)
              if gift_wrap:
                  price += Decimal("2.00")
              return price.quantize(Decimal("0.01"))
  expected_output:
    outcome: valid
- name: a signup form checks a password against its own rules where the password policy already checks it
  inputs:
    file: signup/forms.py
    unchanged:
      accounts/__init__.py: ""
      accounts/passwords.py: |
        class WeakPassword(ValueError):
            pass


        class PasswordPolicy:
            def validate(self, password: str) -> None:
                if len(password) < 12:
                    raise WeakPassword("use at least 12 characters")
                if password.isalpha():
                    raise WeakPassword("include a digit or a symbol")
    after: |
      class SignupForm:
          def __init__(self, data: dict[str, str]) -> None:
              self.data = data

          def password_errors(self) -> list[str]:
              password = self.data.get("password", "")
              errors = []
              if len(password) < 10:
                  errors.append("Password is too short.")
              if not any(char.isdigit() for char in password):
                  errors.append("Password needs a number.")
              return errors
  expected_output:
    outcome: invalid
- name: a signup form checks the email address, a concept nothing else in the program validates
  inputs:
    file: signup/forms.py
    unchanged:
      accounts/__init__.py: ""
      accounts/passwords.py: |
        class WeakPassword(ValueError):
            pass


        class PasswordPolicy:
            def validate(self, password: str) -> None:
                if len(password) < 12:
                    raise WeakPassword("use at least 12 characters")
                if password.isalpha():
                    raise WeakPassword("include a digit or a symbol")
    after: |
      class SignupForm:
          def __init__(self, data: dict[str, str]) -> None:
              self.data = data

          def email_errors(self) -> list[str]:
              email = self.data.get("email", "")
              errors = []
              if "@" not in email:
                  errors.append("Enter a valid email address.")
              if email.endswith((".invalid", ".test")):
                  errors.append("Use a real email domain.")
              return errors
  expected_output:
    outcome: valid
- name: a timeout constant changes
  inputs:
    file: shipping/settings.py
    before: |
      CARRIER_TIMEOUT_SECONDS = 10
    after: |
      CARRIER_TIMEOUT_SECONDS = 20
  expected_output:
    outcome: skipped
- name: a reminder service works out a subscription's next charge date that the renewal schedule already works out
  inputs:
    file: notifications/reminders.ts
    unchanged:
      billing/renewal.ts: |
        import type { Subscription } from "./subscription";

        export class RenewalSchedule {
          nextChargeDate(sub: Subscription): Date {
            const next = new Date(sub.lastChargedAt);
            next.setMonth(next.getMonth() + sub.intervalMonths);
            return next;
          }
        }
    after: |
      import type { Subscription } from "../billing/subscription";

      export class ReminderService {
        renewalDate(sub: Subscription): Date {
          const date = new Date(sub.lastChargedAt);
          date.setMonth(date.getMonth() + sub.intervalMonths);
          return date;
        }

        reminderText(sub: Subscription): string {
          return `Your plan renews on ${this.renewalDate(sub).toDateString()}.`;
        }
      }
  expected_output:
    outcome: invalid
- name: a reminder service has the renewal schedule work out a subscription's next charge date
  inputs:
    file: notifications/reminders.ts
    unchanged:
      billing/renewal.ts: |
        import type { Subscription } from "./subscription";

        export class RenewalSchedule {
          nextChargeDate(sub: Subscription): Date {
            const next = new Date(sub.lastChargedAt);
            next.setMonth(next.getMonth() + sub.intervalMonths);
            return next;
          }
        }
    after: |
      import { RenewalSchedule } from "../billing/renewal";
      import type { Subscription } from "../billing/subscription";

      export class ReminderService {
        constructor(private readonly schedule: RenewalSchedule) {}

        reminderText(sub: Subscription): string {
          return `Your plan renews on ${this.schedule.nextChargeDate(sub).toDateString()}.`;
        }
      }
  expected_output:
    outcome: valid
- name: two carriers each work out a parcel's cost for the carrier interface they implement
  inputs:
    file: shipping/carriers.ts
    after: |
      import type { Parcel } from "./parcel";

      export interface Carrier {
        cost(parcel: Parcel): number;
      }

      export class RoyalMail implements Carrier {
        cost(parcel: Parcel): number {
          return 350 + 90 * Math.ceil(parcel.weightKg);
        }
      }

      export class DpdCarrier implements Carrier {
        cost(parcel: Parcel): number {
          return parcel.weightKg > 20 ? 1800 : 900;
        }
      }
  expected_output:
    outcome: valid
