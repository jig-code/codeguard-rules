name: codeguard-rules CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CODEGUARD_REF: 0edcf4fc9136ebf96fbef54866c9c9395e3c3567
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rules
      - uses: actions/checkout@v7
        with:
          repository: jig-code/codeguard
          ref: ${{ env.CODEGUARD_REF }}
          path: codeguard
      - uses: astral-sh/setup-uv@v10.2.0
      - name: codeguard test
        working-directory: rules
        run: uv run --frozen --project ../codeguard codeguard test
  eval:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        provider: [gemini, claude-cli]
    steps:
      - uses: actions/checkout@v7
        with:
          path: rules
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: jig-code/codeguard
          ref: ${{ env.CODEGUARD_REF }}
          path: codeguard
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Find the judge rules this change can affect
        id: affected
        working-directory: rules
        run: |
          base=$(git merge-base "$BASE" HEAD)
          rules=$(uv run --frozen --project ../codeguard python scripts/affected_judge_rules.py "$base")
          echo "rules=$(echo $rules)" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - if: steps.affected.outputs.rules && matrix.provider == 'claude-cli'
        run: npm install --global @anthropic-ai/claude-code
      - if: steps.affected.outputs.rules && matrix.provider == 'claude-cli'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CLAUDE_AWS_ROLE }}
          aws-region: us-west-2
      - if: steps.affected.outputs.rules && matrix.provider == 'gemini'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: codeguard eval on the affected judge rules, 3 times each
        if: steps.affected.outputs.rules
        working-directory: rules
        run: |
          args=()
          for rule in $RULES; do args+=(--rule "$rule"); done
          repeat=3
          if [ "$PROVIDER" = claude-cli ]; then
            args+=(--provider claude-cli --model "$BEDROCK_MODEL")
            repeat=20
          else
            export CODEGUARD_CONFIG=.github/codeguard-gemini-eval.yaml
          fi
          uv run --frozen --project ../codeguard codeguard eval --repeat "$repeat" "${args[@]}"
        env:
          RULES: ${{ steps.affected.outputs.rules }}
          PROVIDER: ${{ matrix.provider }}
          CLAUDE_CODE_USE_BEDROCK: 1
          AWS_REGION: us-west-2
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: global
